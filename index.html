// ---- src/lesson-engine.mjs ----
// 차시 자료(글자 판, 묶음 번호, 기법 이름)를 화면이 쓸 문제로 펼친다. 정답은 자료에 적지 않고 엔진이 계산한다.
// 시험(tests/lessons.test.mjs)이 모든 걸음을 펼쳐 유일해, 기법 상한, 정답을 다시 확인한다.

function packKind(packId) {
  if (/^s\d/.test(packId)) return 'sd';
  if (/^c\d/.test(packId)) return 'ct';
  throw new Error('묶음 이름이 잘못됨: ' + packId);
}
function packEntry(packId, i) {
  const list = PACKS[packId];
  if (!list || list[i] === undefined) throw new Error('묶음 문제가 없음: ' + packId + '#' + i);
  return list[i];
}
function loadPuzzle(ref) {
  if (Array.isArray(ref)) ref = ref.join('');
  const text = typeof ref === 'string' ? ref : packEntry(ref.pack, ref.i);
  const kind = typeof ref === 'string' ? (/^[.1-9]+$/.test(ref.replace(/\s+/g, '')) ? 'sd' : 'ct') : packKind(ref.pack);
  if (kind === 'sd') {
    const puzzle = sdParse(text);
    return { kind, n: Math.round(Math.sqrt(puzzle.length)), puzzle, text };
  }
  const { n, region, cats } = ctParse(text);
  return { kind, n, region, cats, text };
}

const unitOf = (shape, kind, i) => shape.units.find((u) => u.kind === kind && u.i === i);

// 걸음 하나를 화면용으로 펼친다. 돌려주는 모양:
// { t, kind, n, puzzle|region, values|cats, marks, notes, focus:[unit], spot:[칸], prompt, answer, solution, explain }
// answer: { place: {x, d} } (스도쿠 숫자 놓기) | { cat: x } | { cells: [...], mode: 'one'|'all' } | { choice: i } | { mask }
function expandItem(item, regionName = ctDefaultRegionName) {
  const t = item.t;
  if (t === 'card') {
    const out = { t, title: item.title, text: item.text, board: item.board || null, show: item.show || null };
    if (item.demo) out.demo = expandItem({ t: 'step', ...item.demo }, regionName);
    return out;
  }
  if (t === 'quiz') return { t, prompt: item.q, options: item.options, answer: { choice: item.answer }, explain: item.why };
  const P = loadPuzzle(item.board || { pack: item.pack, i: item.i });
  if (P.kind === 'sd') return expandSd(item, P);
  return expandCt(item, P, regionName);
}

function expandSd(item, P) {
  const { n, puzzle } = P;
  const shape = sdShape(n);
  const base = { t: item.t, kind: 'sd', n, puzzle, notesOn: Boolean(item.notes) };
  const C = (x) => sdCellName(n, x);
  if (item.t === 'tap') {
    const values = puzzle.slice();
    const [check, ...args] = item.check.split(':');
    let cells, mode = 'one', focus = [];
    let prompt = item.prompt;
    if (check === 'conflict') cells = sdConflicts(values);
    else if (check === 'unit') { const u = unitOf(shape, args[0], Number(args[1])); cells = u.cells; focus = []; }
    else if (check === 'cell') cells = [Number(args[0]) * n + Number(args[1])];
    else if (check === 'cand') {
      const u = unitOf(shape, args[1], Number(args[2]));
      const st = sdState(values);
      const where = (d) => u.cells.filter((x) => st.cand[x] & (1 << (d - 1)));
      // auto: 상자에 아직 없고 후보 칸이 둘 이상인 가장 작은 숫자
      const d = args[0] === 'auto' ? [...Array(n)].map((_, i) => i + 1).find((k) => !u.cells.some((x) => values[x] === k) && where(k).length >= 2) : Number(args[0]);
      cells = where(d); mode = 'all'; focus = [u];
      prompt = prompt.replace('{d}', josa(String(d), '이가'));
    } else throw new Error('모르는 짚기: ' + item.check);
    return { ...base, values, focus, prompt, answer: { cells, mode }, explain: item.why || '' };
  }
  const solution = sdSolution(puzzle);
  if (!solution) throw new Error('해가 하나가 아닌 스도쿠: ' + P.text);
  if (item.t === 'count' || item.t === 'memo') {
    const st = sdState(puzzle);
    // cell 이 없으면 고른다: 세기는 후보가 가장 적은 칸, 메모는 후보가 2~3개인 첫 칸
    let x;
    if (item.cell) x = item.cell[0] * n + item.cell[1];
    else {
      const empty = puzzle.map((v, y) => (v ? -1 : y)).filter((y) => y >= 0);
      if (item.t === 'count') x = empty.reduce((a, y) => (sdPopcount(st.cand[y]) < sdPopcount(st.cand[a]) ? y : a), empty[0]);
      else x = empty.find((y) => { const k = sdPopcount(st.cand[y]); return k >= 2 && k <= 3; }) ?? empty[0];
    }
    const mask = st.cand[x];
    if (item.t === 'count') {
      const k = sdPopcount(mask);
      const options = [...Array(Math.min(n, 4))].map((_, i) => String(i + 1));
      return { ...base, values: puzzle.slice(), solution, spot: [x], focus: [], prompt: item.prompt || `${C(x)}에 들어갈 수 있는 숫자는 몇 개일까요?`, options, answer: { choice: k - 1 }, explain: `가로줄, 세로줄, 상자에 없는 숫자는 ${digitsText(mask, n)}예요.` };
    }
    return { ...base, notesOn: true, values: puzzle.slice(), solution, spot: [x], focus: [], prompt: item.prompt || `${C(x)}에 들어갈 수 있는 숫자를 모두 메모해 보세요.`, answer: { mask, x }, explain: `들어갈 수 있는 숫자는 ${digitsText(mask, n)}예요.` };
  }
  if (item.t === 'solve' || item.t === 'guided') {
    return { ...base, values: puzzle.slice(), solution, focus: [], prompt: item.prompt || (item.t === 'guided' ? '설명을 따라 한 걸음씩 풀어 보세요.' : '끝까지 풀어 보세요.'), answer: { solution }, guided: item.t === 'guided' ? (item.steps || 6) : 0 };
  }
  if (item.t === 'step') {
    const found = sdFindLessonStep(puzzle, item.tech, { nth: item.nth || 0, match: item.match, easiest: item.easiest });
    if (!found) throw new Error('이 판에서 기법을 찾지 못함: ' + item.tech + ' ' + P.text);
    const { step } = found;
    const showNotes = Boolean(item.notes) || Boolean(step.elim);
    // 메모를 보여 주는 걸음은 보이는 메모를 근거로 말한다
    const text = sdStepText(n, step, { memo: showNotes });
    const notes = showNotes ? found.cand.map((m, x) => (found.values[x] ? 0 : m)) : null;
    const out = { ...base, t: 'step', tech: step.tech, values: found.values, notes, notesOn: showNotes, solution, explain: text.why, techName: text.name, step };
    const d = step.digit;
    if (step.place) {
      const { x, d: dd } = step.place[0];
      if (step.tech === 'naked-single') return { ...out, focus: [], spot: [x], prompt: item.prompt || `${josa(C(x), '은는')} 들어갈 수 있는 숫자가 하나뿐이에요. 그 숫자를 놓아 보세요.`, answer: { place: { x, d: dd } } };
      if (step.tech === 'full-house') return { ...out, focus: [step.unit], spot: [], prompt: item.prompt || `${sdUnitName(step.unit)}의 빈칸을 채워 보세요.`, answer: { place: { x, d: dd } } };
      return { ...out, focus: [step.unit], spot: [], prompt: item.prompt || `${sdUnitName(step.unit)}에서 ${josa(String(dd), '이가')} 들어갈 칸을 찾아 ${josa(String(dd), '을를')} 놓아 보세요.`, answer: { place: { x, d: dd } } };
    }
    if (step.tech === 'hidden-pair' || step.tech === 'hidden-triple') {
      return { ...out, focus: step.focus, spot: [], prompt: item.prompt || `${sdUnitName(step.unit)}에서 ${josa(step.digits.join(', '), '이가')} 들어갈 수 있는 칸을 모두 고르세요.`, answer: { cells: step.cells.slice(), mode: 'all' } };
    }
    const cells = step.elim.map((e) => e.x);
    const what = d ? josa(String(d), '을를') : josa(step.digits.join(', '), '을를');
    return { ...out, focus: step.focus, spot: step.tech.startsWith('naked') ? step.cells.slice() : [], prompt: item.prompt || `표시한 곳을 보고, ${what} 지울 수 있는 칸을 모두 고르세요.`, answer: { cells, mode: 'all' } };
  }
  throw new Error('모르는 걸음: ' + item.t);
}

function digitsText(mask, n) {
  const ds = [];
  for (let d = 1; d <= n; d++) if (mask & (1 << (d - 1))) ds.push(d);
  return ds.join(', ');
}

function expandCt(item, P, regionNameIn) {
  const { n, region } = P;
  // 구역 이름 함수는 (구역 번호, 판의 구역 배열)을 받는다. 화면은 판마다 색 배정이 달라서다.
  const regionName = (g) => regionNameIn(g, region);
  const base = { t: item.t, kind: 'ct', n, region };
  if (item.t === 'tap') {
    const cats = P.cats.slice();
    const [check] = item.check.split(':');
    let cells, mode = 'one';
    if (check === 'conflict') cells = ctConflicts(n, region, cats).cells;
    else if (check === 'blocked') { cells = ctBlockedBy(n, region, cats[0]); mode = 'all'; }
    else if (check === 'smallest') {
      const sizes = [...Array(n)].map((_, g) => region.filter((v) => v === g).length);
      const min = Math.min(...sizes);
      cells = region.map((g, x) => (sizes[g] === min ? x : -1)).filter((x) => x >= 0);
    } else throw new Error('모르는 짚기: ' + item.check);
    return { ...base, cats, marks: [], focus: [], prompt: item.prompt, answer: { cells, mode }, explain: item.why || '' };
  }
  const solution = ctSolution(n, region);
  if (!solution) throw new Error('해가 하나가 아닌 고양이 자리: ' + P.text);
  if (item.t === 'solve' || item.t === 'guided') {
    return { ...base, cats: [], marks: [], solution, focus: [], prompt: item.prompt || (item.t === 'guided' ? '설명을 따라 한 걸음씩 풀어 보세요.' : '모든 고양이 자리를 찾아 보세요.'), answer: { solution }, guided: item.t === 'guided' ? (item.steps || 6) : 0 };
  }
  if (item.t === 'step') {
    const found = ctFindLessonStep(n, region, item.tech, { nth: item.nth || 0, match: item.match, easiest: item.easiest });
    if (!found) throw new Error('이 판에서 기법을 찾지 못함: ' + item.tech + ' ' + P.text);
    let { step } = found;
    // 가정해 보기: 가장 짧게 막히는 칸만 정답으로 친다(어느 칸이나 눌러서 맞히는 일이 없게)
    let whatIf = null;
    if (step.tech === 'what-if') {
      const minDepth = Math.min(...found.all.map((s) => s.depth));
      whatIf = found.all.filter((s) => s.depth === minDepth);
      step = whatIf[0];
    }
    const text = ctStepText(n, step, regionName);
    const marks = found.cand.map((v, x) => (!v && !found.cats.includes(x) ? x : -1)).filter((x) => x >= 0);
    const out = { ...base, tech: step.tech, cats: found.cats, marks, solution, explain: text.why, techName: text.name, step };
    const U = (u) => ctUnitName(u, regionName);
    if (step.place) return { ...out, focus: step.focus, spot: [], prompt: item.prompt || `${U(step.unit)}에 고양이를 놓아 보세요.`, answer: { cat: step.place[0] } };
    if (step.tech === 'blocks-all') {
      const same = found.all.filter((s) => s.unit.kind === step.unit.kind && s.unit.i === step.unit.i).map((s) => s.cell);
      return { ...out, focus: [step.unit], spot: [], prompt: item.prompt || `여기에 두면 ${U(step.unit)}의 자리가 모두 막히는 칸이 있어요. 찾아서 ×를 해 보세요.`, answer: { cells: same, mode: 'one' } };
    }
    if (step.tech === 'what-if') {
      return { ...out, focus: [], spot: [], prompt: item.prompt || `배운 기법으로는 더 지울 칸이 없어요. 한 칸에 두었다고 해 보고 ${whatIf[0].depth}걸음 만에 막히는 칸을 찾아 ×를 해 보세요.`, answer: { cells: whatIf.map((s) => s.cell), mode: 'one' }, depth: whatIf[0].depth };
    }
    return { ...out, focus: step.focus, spot: [], prompt: item.prompt || '표시한 곳을 보고, ×를 할 칸을 모두 고르세요.', answer: { cells: step.elim.slice(), mode: 'all' } };
  }
  throw new Error('모르는 걸음: ' + item.t);
}

// 별: 틀림과 힌트를 합해 0이면 3개, 2 이하면 2개, 그보다 많으면 1개
function starsFor(mistakes, hints) {
  const k = mistakes + hints;
  return k === 0 ? 3 : k <= 2 ? 2 : 1;
}

// 답 확인(화면과 시험이 함께 쓴다)
function checkPick(answer, picked) {
  const want = new Set(answer.cells);
  if (answer.mode === 'one') return picked.length === 1 && want.has(picked[0]);
  const got = new Set(picked);
  return got.size === want.size && [...want].every((x) => got.has(x));
}

// ---- src/lessons/index.mjs ----
// 두 갈래 길을 묶고, 차시 열림·다음 차시·미션을 계산한다.

const PATHS = [
  { id: 'sd', title: '스도쿠 길', lessons: SD_LESSONS, missions: SD_MISSIONS, units: SD_UNITS },
  { id: 'ct', title: '고양이 자리 길', lessons: CT_LESSONS, missions: CT_MISSIONS, units: CT_UNITS },
];

function sentenceCount(text) {
  return (String(text).match(/[.?!](?=\s|$)/g) || []).length;
}

function findLesson(id) {
  for (const p of PATHS) {
    const i = p.lessons.findIndex((l) => l.id === id);
    if (i >= 0) return { path: p, lesson: p.lessons[i], index: i };
    const m = p.missions.find((x) => x.id === id);
    if (m) return { path: p, mission: m };
  }
  return null;
}

// 길 안에서 앞 차시를 마쳐야 다음이 열린다. 단원 미션은 그 단원 차시를 모두 마치면 열린다.
// skipTo: 어른이 단원을 건너뛰면(설정) 모든 차시가 열린다.
function isOpen(id, isDone, openAll = false) {
  if (openAll) return true;
  const f = findLesson(id);
  if (!f) return false;
  if (f.mission) return f.path.lessons.filter((l) => l.unit === f.mission.unit).every((l) => isDone(l.id));
  return f.index === 0 || isDone(f.path.lessons[f.index - 1].id);
}

function nextLesson(pathId, isDone) {
  const p = PATHS.find((x) => x.id === pathId);
  return p.lessons.find((l) => !isDone(l.id)) || null;
}

function pathProgress(pathId, isDone) {
  const p = PATHS.find((x) => x.id === pathId);
  const done = p.lessons.filter((l) => isDone(l.id)).length;
  return { done, total: p.lessons.length };
}

// ---- src/store.mjs ----
// 프로필과 진행도 저장. 기기 안(localStorage)에만 저장하고 밖으로 보내지 않는다(바둑 첫걸음 store 를 고쳐 씀).
// storage 는 getItem/setItem 을 가진 객체. 저장이 막힌 환경에서도 앱은 동작한다(저장만 안 됨).
// 형식(version 1, rev 2): { version, rev, current, profiles: [{ id, name, color, level, done, missions, daily, best, progress, review, last }] }
// rev 2(v1.0.2): 오늘의 퍼즐 기록을 날짜 × 난이도 × 퍼즐로 나눔 daily[date][level] = { sudoku, cats, sudokuHelp, catsHelp, gen },
//   진행 중 저장을 퍼즐별 여러 칸으로 progress[key] = { state, at }(오늘의 퍼즐 난이도×퍼즐 최대 6칸 + 자유 연습 1칸).
//   rev 1 기록(daily[date] = { sudoku, cats, level, ... }, inProgress 한 칸)은 읽을 때 옮긴다(level 이 없으면 쉬움).
const STORE_KEY = 'puzzle-guide:v1';
const STORE_REV = 2;
const MAX_PROGRESS = 7;
const MAX_PROFILES = 5;
const MAX_NAME = 8;
const MAX_REVIEW = 60;
const MAX_DAILY = 800;
const BACKUP_APP = 'puzzle-guide';
const LEVELS = ['easy', 'normal', 'hard'];

function emptyData() {
  return { version: 1, rev: STORE_REV, current: null, profiles: [] };
}

function isValid(d) {
  return Boolean(d) && d.version === 1 && Array.isArray(d.profiles) &&
    d.profiles.every((p) => p && typeof p.id === 'string' && typeof p.name === 'string' && p.done && typeof p.done === 'object');
}

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const secs = (v) => (Number.isFinite(v) && v >= 0 && v < 360000 ? Math.round(v) : null);

const PUZZLES = ['sudoku', 'cats'];

// 한 난이도 칸 { sudoku, cats, sudokuHelp, catsHelp, gen } 을 고른다. 푼 것이 없으면 null.
function cleanLevelEntry(v) {
  if (!v || typeof v !== 'object') return null;
  const e = {};
  for (const w of PUZZLES) {
    if (secs(v[w]) === null) continue;
    e[w] = secs(v[w]);
    // 힌트 3단계로 채운 판(혼자 푼 기록이 없을 때만 남는다)
    if (v[w + 'Help'] === true) e[w + 'Help'] = true;
  }
  if (Number.isInteger(v.gen)) e.gen = v.gen;
  return e.sudoku !== undefined || e.cats !== undefined ? e : null;
}

// 같은 난이도 칸 둘을 합친다(혼자 푼 기록 > 힌트 기록, 같은 종류면 더 빠른 것)
function mergeLevelEntry(a, b) {
  if (!a) return b;
  if (!b) return a;
  const e = { ...a };
  for (const w of PUZZLES) {
    if (b[w] === undefined) continue;
    const hk = w + 'Help';
    if (e[w] === undefined || (e[hk] && !b[hk])) { e[w] = b[w]; if (b[hk]) e[hk] = true; else delete e[hk]; }
    else if (Boolean(e[hk]) === Boolean(b[hk])) e[w] = Math.min(e[w], b[w]);
  }
  if (b.gen !== undefined && e.gen === undefined) e.gen = b.gen;
  return e;
}

// 하루 칸: rev 2 형식 { easy: {...}, normal: {...}, hard: {...} }.
// rev 1 형식(맨 위에 sudoku·cats·level)은 그 level(없으면 easy) 칸으로 옮긴다. 이미 옮긴 칸에 다시 돌려도 그대로다.
function migrateDay(v) {
  if (!v || typeof v !== 'object') return null;
  const out = {};
  for (const lv of LEVELS) { const e = cleanLevelEntry(v[lv]); if (e) out[lv] = e; }
  const old = cleanLevelEntry(v);
  if (old) { const lv = LEVELS.includes(v.level) ? v.level : 'easy'; out[lv] = mergeLevelEntry(out[lv], old); }
  return Object.keys(out).length ? out : null;
}

function cleanDaily(daily) {
  const out = {};
  if (!daily || typeof daily !== 'object') return out;
  const keys = Object.keys(daily).filter((k) => DATE_RE.test(k)).sort().slice(-MAX_DAILY);
  for (const k of keys) {
    const day = migrateDay(daily[k]);
    if (day) out[k] = day;
  }
  return out;
}

// 하루 기록 요약: 퍼즐마다 'solo'(어느 난이도든 혼자 풂) | 'help'(힌트와 함께만) | null
function dayFlags(day) {
  const f = { sudoku: null, cats: null };
  if (!day) return f;
  for (const lv of LEVELS) {
    const e = day[lv];
    if (!e) continue;
    for (const w of PUZZLES) if (e[w] !== undefined) f[w] = !e[w + 'Help'] || f[w] === 'solo' ? 'solo' : 'help';
  }
  return f;
}

function cleanProgressItem(v) {
  if (!v || typeof v !== 'object' || typeof v.state !== 'object' || !v.state) return null;
  const json = JSON.stringify(v.state);
  if (json.length > 4000) return null;
  return { state: JSON.parse(json), at: Number.isFinite(v.at) ? v.at : 0 };
}

const PROGRESS_KEY_RE = /^(?:daily-(?:sd|ct)-\d{4}-\d{2}-\d{2}-(?:easy|normal|hard)|free)$/;

// 진행 중 저장 여러 칸. rev 1 의 inProgress(한 칸)도 옮긴다. 새 것부터 MAX_PROGRESS 칸.
function cleanProgress(map, oldOne) {
  const items = [];
  if (map && typeof map === 'object') for (const [k, v] of Object.entries(map)) {
    const c = PROGRESS_KEY_RE.test(k) ? cleanProgressItem(v) : null;
    if (c) items.push([k, c]);
  }
  if (oldOne && typeof oldOne === 'object' && typeof oldOne.key === 'string' && PROGRESS_KEY_RE.test(oldOne.key) && !items.some(([k]) => k === oldOne.key)) {
    const c = cleanProgressItem(oldOne);
    if (c) items.push([oldOne.key, c]);
  }
  items.sort((a, b) => b[1].at - a[1].at);
  return Object.fromEntries(items.slice(0, MAX_PROGRESS));
}

// 지난 날짜의 오늘의 퍼즐 진행은 지운다(자유 연습 칸은 남김)
function pruneProgressMap(map, today) {
  const out = {};
  for (const [k, v] of Object.entries(map || {})) if (k === 'free' || k.slice(9, 19) === today) out[k] = v;
  return out;
}

// 예전 형식이나 빠진 칸이 있는 자료를 지금 형식으로 맞춘다. 맞출 수 없으면 null.
function migrateData(d) {
  if (!isValid(d)) return null;
  const profiles = d.profiles.map((p) => {
    const done = {};
    for (const [k, v] of Object.entries(p.done)) {
      if (k.length > 8) continue;
      const stars = v && Number.isFinite(v.stars) ? Math.max(1, Math.min(3, Math.round(v.stars))) : 1;
      done[k] = { stars };
    }
    const missions = {};
    if (p.missions && typeof p.missions === 'object') for (const [k, v] of Object.entries(p.missions)) if (v && k.length <= 8) missions[k] = true;
    const best = {};
    if (p.best && typeof p.best === 'object') for (const [k, v] of Object.entries(p.best)) if (k.length <= 30 && secs(v) !== null) best[k] = secs(v);
    const review = Array.isArray(p.review) ? [...new Set(p.review.filter((k) => typeof k === 'string' && k.length <= 20))].slice(-MAX_REVIEW) : [];
    return {
      id: p.id, name: p.name,
      color: Number.isInteger(p.color) ? p.color : 0,
      level: LEVELS.includes(p.level) ? p.level : 'easy',
      done, missions, best, review,
      daily: cleanDaily(p.daily),
      progress: cleanProgress(p.progress, p.inProgress),
      last: typeof p.last === 'string' ? p.last : null,
    };
  });
  const current = profiles.some((p) => p.id === d.current) ? d.current : (profiles[0] ? profiles[0].id : null);
  return { version: 1, rev: STORE_REV, current, profiles };
}

// 기록 파일(내보내기 결과)을 검사한다. { ok: true, data } 또는 { ok: false, error }
function validateBackup(obj) {
  if (typeof obj === 'string') {
    try { obj = JSON.parse(obj); } catch (err) { return { ok: false, error: 'format' }; }
  }
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { ok: false, error: 'format' };
  if (obj.app !== BACKUP_APP || obj.kind !== 'backup') return { ok: false, error: 'app' };
  const raw = obj.data;
  if (!raw || !Array.isArray(raw.profiles)) return { ok: false, error: 'format' };
  if (raw.profiles.length > MAX_PROFILES) return { ok: false, error: 'too-many' };
  const data = migrateData(raw);
  if (!data) return { ok: false, error: 'profiles' };
  const ids = new Set();
  const names = new Set();
  for (const p of data.profiles) {
    const clean = cleanName(p.name);
    if (!clean || clean !== p.name || ids.has(p.id) || names.has(p.name)) return { ok: false, error: 'profiles' };
    ids.add(p.id);
    names.add(p.name);
  }
  return { ok: true, data };
}

function cleanName(name) {
  return [...String(name ?? '').replace(/\s+/g, ' ').trim()].slice(0, MAX_NAME).join('');
}

function createStore(storage) {
  let data = emptyData();
  try {
    const raw = storage.getItem(STORE_KEY);
    const migrated = migrateData(raw ? JSON.parse(raw) : null);
    if (migrated) data = migrated;
  } catch (err) {
    data = emptyData();
  }
  let saveOk = true;
  const save = () => {
    try { storage.setItem(STORE_KEY, JSON.stringify(data)); saveOk = true; } catch (err) { saveOk = false; }
  };
  const current = () => data.profiles.find((p) => p.id === data.current) || null;
  const withP = (fn, fallback) => { const p = current(); return p ? fn(p) : fallback; };

  return {
    canSave: () => saveOk,
    profiles: () => data.profiles.map((p) => ({ ...p })),
    current,

    // 성공하면 프로필, 실패하면 { error: 'empty' | 'full' | 'duplicate' }
    addProfile(name) {
      const clean = cleanName(name);
      if (!clean) return { error: 'empty' };
      if (data.profiles.length >= MAX_PROFILES) return { error: 'full' };
      if (data.profiles.some((p) => p.name === clean)) return { error: 'duplicate' };
      const used = data.profiles.map((p) => Number(p.id.slice(1)) || 0);
      const n = Math.max(0, ...used) + 1;
      const colors = data.profiles.map((p) => p.color);
      let color = 0;
      while (colors.includes(color) && color < MAX_PROFILES) color++;
      const profile = { id: 'p' + n, name: clean, color, level: 'easy', done: {}, missions: {}, best: {}, daily: {}, progress: {}, review: [], last: null };
      data.profiles.push(profile);
      data.current = profile.id;
      save();
      return profile;
    },
    renameProfile(id, name) {
      const clean = cleanName(name);
      const p = data.profiles.find((q) => q.id === id);
      if (!p || !clean) return { error: 'empty' };
      if (data.profiles.some((q) => q.id !== id && q.name === clean)) return { error: 'duplicate' };
      p.name = clean; save(); return p;
    },
    selectProfile(id) {
      if (!data.profiles.some((p) => p.id === id)) return false;
      data.current = id; save(); return true;
    },
    removeProfile(id) {
      const before = data.profiles.length;
      data.profiles = data.profiles.filter((p) => p.id !== id);
      if (data.profiles.length === before) return false;
      if (data.current === id) data.current = data.profiles[0] ? data.profiles[0].id : null;
      save(); return true;
    },
    setLevel(level) { withP((p) => { if (LEVELS.includes(level)) { p.level = level; save(); } }); },
    level: () => withP((p) => p.level, 'easy'),

    // 차시 완료. 별은 가장 좋았던 기록을 남긴다.
    completeLesson(lessonId, stars) {
      withP((p) => {
        const prev = p.done[lessonId] ? p.done[lessonId].stars : 0;
        p.done[lessonId] = { stars: Math.max(prev, Math.max(1, Math.min(3, stars))) };
        p.last = lessonId;
        save();
      });
    },
    isDone: (lessonId) => withP((p) => Boolean(p.done[lessonId]), false),
    starsOf: (lessonId) => withP((p) => (p.done[lessonId] ? p.done[lessonId].stars : 0), 0),
    totalStars: () => withP((p) => Object.values(p.done).reduce((a, v) => a + v.stars, 0), 0),
    completeMission(id) { withP((p) => { p.missions[id] = true; save(); }); },
    missionDone: (id) => withP((p) => Boolean(p.missions[id]), false),
    lastLesson: () => withP((p) => p.last, null),

    // 오늘의 퍼즐: 날짜 × 난이도 × 퍼즐마다 걸린 초를 남긴다(같은 날 같은 난이도를 다시 풀면 더 빠른 기록).
    // help: 힌트 3단계로 채운 판. 혼자 푼 기록이 힌트 도움 기록보다 우선한다. 난이도를 모르면 쉬움.
    recordDaily(date, which, seconds, gen, level, help = false) {
      withP((p) => {
        if (!DATE_RE.test(date) || !PUZZLES.includes(which)) return;
        const s = secs(seconds);
        if (s === null) return;
        const lv = LEVELS.includes(level) ? level : 'easy';
        const day = p.daily[date] || {};
        const add = { [which]: s };
        if (help) add[which + 'Help'] = true;
        if (Number.isInteger(gen)) add.gen = gen;
        day[lv] = mergeLevelEntry(day[lv], add);
        if (Number.isInteger(gen)) day[lv].gen = gen;
        p.daily[date] = day;
        p.daily = cleanDaily(p.daily);
        save();
      });
    },
    // level 을 주면 그 난이도 칸, 안 주면 하루 전체 { easy, normal, hard }
    dailyOf: (date, level) => withP((p) => { const d = p.daily[date]; if (!d) return null; return level ? (d[level] || null) : JSON.parse(JSON.stringify(d)); }, null),
    dailyAll: () => withP((p) => JSON.parse(JSON.stringify(p.daily)), {}),

    // 퍼즐별 최고 기록(초). 더 빠르면 바꾸고 true
    recordBest(key, seconds) {
      return withP((p) => {
        const s = secs(seconds);
        if (s === null || key.length > 30) return false;
        if (p.best[key] !== undefined && p.best[key] <= s) return false;
        p.best[key] = s; save(); return true;
      }, false);
    },
    bestAll: () => withP((p) => ({ ...p.best }), {}),

    // 진행 중인 퍼즐(자동 저장): 퍼즐마다 한 칸. key: daily-sd|ct-날짜-난이도 또는 free
    saveProgress(key, state, now = Date.now()) {
      withP((p) => {
        if (!PROGRESS_KEY_RE.test(key)) return;
        const c = cleanProgressItem({ state, at: now });
        if (!c) return;
        const map = { ...p.progress, [key]: c };
        p.progress = cleanProgress(key === 'free' ? map : pruneProgressMap(map, key.slice(9, 19)));
        save();
      });
    },
    progressOf: (key) => withP((p) => (p.progress[key] ? { key, ...p.progress[key] } : null), null),
    progressKeys: () => withP((p) => Object.keys(p.progress), []),
    clearProgress(key) { withP((p) => { if (p.progress[key]) { delete p.progress[key]; save(); } }); },
    // 오늘이 아닌 날의 오늘의 퍼즐 진행을 지운다
    pruneProgress(today) {
      withP((p) => { const next = pruneProgressMap(p.progress, today); if (Object.keys(next).length !== Object.keys(p.progress).length) { p.progress = next; save(); } });
    },

    addReview(key) {
      withP((p) => {
        p.review = p.review.filter((k) => k !== key);
        p.review.push(key);
        if (p.review.length > MAX_REVIEW) p.review = p.review.slice(-MAX_REVIEW);
        save();
      });
    },
    reviewList: () => withP((p) => [...p.review], []),

    exportBackup(now = new Date()) {
      return { app: BACKUP_APP, kind: 'backup', exportedAt: now.toISOString(), data: JSON.parse(JSON.stringify(data)) };
    },
    importBackup(obj) {
      const r = validateBackup(obj);
      if (!r.ok) return r;
      data = r.data;
      save();
      return { ok: true, count: data.profiles.length };
    },
  };
}

function memoryStorage() {
  const map = new Map();
  return {
    getItem: (k) => (map.has(k) ? map.get(k) : null),
    setItem: (k, v) => { map.set(k, String(v)); },
  };
}

// 기기 설정과 "새로 생긴 것" 안내. 프로필과 상관없이 기기마다 하나(바둑 첫걸음 settings 를 고쳐 씀).
const APP_VERSION = '1.0.2';
const SETTINGS_KEY = 'puzzle-guide:settings';
const THEMES = ['auto', 'light', 'dark'];
const PIECES = ['cat', 'star'];

const DEFAULT_SETTINGS = Object.freeze({
  theme: 'auto',       // 기기 설정을 따른다
  challenge: false,    // 도전 모드: 틀린 수를 바로 알리고 하트 3개
  timer: true,         // 시간 기록 보이기
  autoClean: true,     // 숫자를 놓으면 같은 줄·상자 메모에서 지우기
  autoX: true,         // 고양이를 놓으면 둘 수 없는 칸에 흐린 점
  pattern: true,       // 구역 무늬(색약 대비)
  piece: 'cat',        // 고양이 또는 별
  openAll: false,      // 어른용: 모든 차시 열기
  tipDots: false,      // 자동 점 안내를 한 번 보여 줬는지
  seen: '',            // "새로 생긴 것"을 마지막으로 보여 준 판
});

const WHATS_NEW = [
  { v: '1.0.2', title: '오늘의 퍼즐 기록을 난이도마다', text: '쉬움·보통·어려움을 따로 기록해요. 놀이터 카드와 난이도 고르기에서 오늘 어느 난이도를 풀었는지 보이고, 난이도를 바꿨다 돌아와도 풀던 판이 이어져요.' },
  { v: '1.0.1', title: '홈 화면에 앱으로 설치', text: '놀이터 아래나 더보기에서 「홈 화면에 앱으로 설치」를 누르면 주소창 없이 앱처럼 열려요. 설치 창이 뜨지 않는 기기에는 방법을 차례로 알려 줘요.' },
  { v: '1.0.0', title: '퍼즐 놀이터를 열었어요', text: '스도쿠 18차시와 고양이 자리 14차시, 단원 미션 10개를 차례로 풀어 볼 수 있어요.' },
  { v: '1.0.0', title: '다음 한 수를 알려 주는 힌트', text: '막히면 힌트를 눌러요. 어디를 볼지, 왜 그런지, 어떻게 하는지 세 번에 나눠 알려 줘요.' },
  { v: '1.0.0', title: '오늘의 퍼즐', text: '날마다 스도쿠 하나와 고양이 자리 하나. 같은 날에는 가족 모두 같은 문제를 받아요.' },
  { v: '1.0.0', title: '기록과 달력', text: '푼 날은 달력에 표시되고, 퍼즐마다 내 최고 기록이 남아요. 기록은 파일로 옮길 수 있어요.' },
];

function cleanSettings(s) {
  const out = { ...DEFAULT_SETTINGS };
  if (!s || typeof s !== 'object') return out;
  for (const k of ['challenge', 'timer', 'autoClean', 'autoX', 'pattern', 'openAll', 'tipDots']) if (typeof s[k] === 'boolean') out[k] = s[k];
  if (THEMES.includes(s.theme)) out.theme = s.theme;
  if (PIECES.includes(s.piece)) out.piece = s.piece;
  if (typeof s.seen === 'string' && s.seen.length <= 20) out.seen = s.seen;
  return out;
}

function loadSettings(storage) {
  try {
    const raw = storage.getItem(SETTINGS_KEY);
    return cleanSettings(raw ? JSON.parse(raw) : null);
  } catch (err) {
    return cleanSettings(null);
  }
}

function saveSettings(storage, s) {
  const clean = cleanSettings(s);
  try { storage.setItem(SETTINGS_KEY, JSON.stringify(clean)); } catch (err) { /* 이번 실행 동안만 */ }
  return clean;
}

function resolveTheme(theme, prefersDark) {
  if (theme === 'light' || theme === 'dark') return theme;
  return prefersDark ? 'dark' : 'light';
}

function compareVersion(a, b) {
  const pa = String(a || '0').split('.').map((n) => Number(n) || 0);
  const pb = String(b || '0').split('.').map((n) => Number(n) || 0);
  for (let i = 0; i < 3; i++) if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
  return 0;
}

function newsSince(seen) {
  return WHATS_NEW.filter((n) => !seen || compareVersion(n.v, seen) > 0);
}

// 처음 쓰는 사람(프로필 없음)에게는 보여 주지 않고 본 것으로 친다.
function shouldShowNews(settings, hasProfiles) {
  return Boolean(hasProfiles) && newsSince(settings.seen).length > 0;
}

// 판 그리기(SVG). 시안 board-puzzle.js 를 앱용으로 옮겨 고침: 칸 48 단위, 색은 모두 var(--토큰).
// 화면은 이 문자열을 넣고, 누른 자리는 boardCellAt 으로 칸 번호를 얻는다.
const BOARD_S = 48;
const ZONE_PATTERNS = [
  '',
  '<circle cx="4" cy="4" r="1.3" style="fill:var(--zone-pattern)"/>',
  '<path d="M-1,9 L9,-1 M-1,1 L1,-1 M7,9 L9,7" style="stroke:var(--zone-pattern)" stroke-width="1.2"/>',
  '<path d="M0,4 H8" style="stroke:var(--zone-pattern)" stroke-width="1.2"/>',
  '<path d="M0,4 H8 M4,0 V8" style="stroke:var(--zone-pattern)" stroke-width="1"/>',
  '<path d="M-1,-1 L9,9 M7,-1 L9,1 M-1,7 L1,9" style="stroke:var(--zone-pattern)" stroke-width="1.2"/>',
  '<circle cx="4" cy="4" r="2.2" fill="none" style="stroke:var(--zone-pattern)" stroke-width="1"/>',
  '<path d="M4,2 V6 M2,4 H6" style="stroke:var(--zone-pattern)" stroke-width="1.2"/>',
  '<path d="M4,0 V8" style="stroke:var(--zone-pattern)" stroke-width="1.2"/>',
  '<path d="M0,6 L2,2 L4,6 L6,2 L8,6" fill="none" style="stroke:var(--zone-pattern)" stroke-width="1"/>',

// 구역 이름(힌트 문장): DESIGN.md 9-5 뿌리 색 + 무늬. 무늬를 끄면 색 이름만.
const ZONE_COLORS = ['주황색', '하늘색', '청록색', '노란색', '파란색', '주홍색', '자주색', '회색', '모래색', '연보라색'];
const ZONE_MARKS = ['민무늬', '점무늬', '빗금무늬', '가로줄무늬', '격자무늬', '반대 빗금무늬', '고리무늬', '더하기무늬', '세로줄무늬', '지그재그무늬'];
function zoneName(z, pattern) { return pattern ? `${ZONE_COLORS[z]} ${ZONE_MARKS[z]} 구역` : `${ZONE_COLORS[z]} 구역`; }
// 색약에서 헷갈리는 색 쌍(DESIGN.md 9-5, 1부터 센 번호). 이웃 구역끼리 이 쌍이 붙지 않게 색을 고른다.
const ZONE_CONFUSE = [[1, 4], [2, 7], [2, 10], [3, 7], [3, 8], [5, 10], [6, 9], [7, 8]].map(([a, b]) => [a - 1, b - 1]);
const zoneMapCache = new Map();
function zoneMap(n, region) {
  const key = region.join('');
  if (zoneMapCache.has(key)) return zoneMapCache.get(key);
  const nb = [...Array(n)].map(() => new Set());
  for (let x = 0; x < n * n; x++) {
    const r = Math.floor(x / n), c = x % n;
    if (c < n - 1 && region[x] !== region[x + 1]) { nb[region[x]].add(region[x + 1]); nb[region[x + 1]].add(region[x]); }
    if (r < n - 1 && region[x] !== region[x + n]) { nb[region[x]].add(region[x + n]); nb[region[x + n]].add(region[x]); }
  }
  const confuse = (a, b) => ZONE_CONFUSE.some(([p, q]) => (p === a && q === b) || (p === b && q === a));
  const map = new Array(n).fill(-1);
  for (let g = 0; g < n; g++) {

    const free = [...Array(10).keys()].filter((z) => !used.has(z));
    map[g] = free.find((z) => [...nb[g]].every((h) => map[h] < 0 || !confuse(z, map[h]))) ?? free[0];

function zoneNamer(n, region, pattern) { const m = zoneMap(n, region); return (g) => zoneName(m[g], pattern); }

let boardSeq = 0;
function zonePatternDefs(id) {
  return ZONE_PATTERNS.map((p, i) => (p ? `<pattern id="${id}-p${i + 1}" width="8" height="8" patternUnits="userSpaceOnUse">${p}</pattern>` : '')).join('');
}

const xMark = (x, y, color, w) => `<path d="M${x + 16},${y + 16} L${x + 32},${y + 32} M${x + 32},${y + 16} L${x + 16},${y + 32}" style="stroke:var(${color})" stroke-width="${w}" stroke-linecap="round"/>`;
const ringRect = (x, y, color, w, dash) => `<rect x="${x + 3}" y="${y + 3}" width="${BOARD_S - 6}" height="${BOARD_S - 6}" rx="8" fill="none" style="stroke:var(${color})" stroke-width="${w}"${dash ? ' stroke-dasharray="4 4"' : ''}/>`;

// 고양이 자리 판. o: { n, region, cats:[칸], marks:[칸], dots:[칸](자동 ×), conflict:[칸], focus:[unit], dim(bool), preview:[칸], previewCat, sel, pick:[칸], pattern, piece, faces:{칸:'happy'|'sorry'}, label }
function renderCatsBoard(o) {
  const n = o.n, S = BOARD_S, W = n * S, id = 'cb' + (++boardSeq);
  const at = (x) => [(x % n) * S, Math.floor(x / n) * S];
  const zmap = zoneMap(n, o.region);
  let g = `<defs>${zonePatternDefs(id)}</defs>`;
  for (let x = 0; x < n * n; x++) {
    const z = zmap[o.region[x]], [px, py] = at(x);
    g += `<rect x="${px}" y="${py}" width="${S}" height="${S}" style="fill:var(--zone-${z + 1})"/>`;
    if (o.pattern !== false && ZONE_PATTERNS[z]) g += `<rect x="${px}" y="${py}" width="${S}" height="${S}" fill="url(#${id}-p${z + 1})"/>`;
  }
  for (let i = 1; i < n; i++) g += `<path d="M${i * S},0 V${W} M0,${i * S} H${W}" style="stroke:var(--zone-line)" stroke-width="1"/>`;
  // 힌트 1단계: 볼 곳만 또렷하게, 나머지는 흐리게
  if (o.focus && o.focus.length) {
    const keep = new Set(o.focus.flatMap((u) => u.cells));
    for (let x = 0; x < n * n; x++) if (!keep.has(x)) { const [px, py] = at(x); g += `<rect x="${px}" y="${py}" width="${S}" height="${S}" style="fill:var(--canvas);opacity:.62"/>`; }
  }
  let edge = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const x = r * n + c;
    if (c < n - 1 && o.region[x] !== o.region[x + 1]) edge += `M${(c + 1) * S},${r * S} V${(r + 1) * S} `;
    if (r < n - 1 && o.region[x] !== o.region[x + n]) edge += `M${c * S},${(r + 1) * S} H${(c + 1) * S} `;
  }
  g += `<path d="${edge}" style="stroke:var(--zone-edge)" stroke-width="3" stroke-linecap="square"/>`;
  g += `<rect x="1.5" y="1.5" width="${W - 3}" height="${W - 3}" rx="6" fill="none" style="stroke:var(--zone-edge)" stroke-width="3"/>`;
  for (const x of o.dots || []) { const [px, py] = at(x); g += `<circle cx="${px + S / 2}" cy="${py + S / 2}" r="3" style="fill:var(--mark-x);opacity:.55"/>`; }
  for (const x of o.marks || []) { const [px, py] = at(x); g += xMark(px, py, '--mark-x', 2.5); }
  for (const x of o.pick || []) { const [px, py] = at(x); g += ringRect(px, py, '--acc-ink', 3); }
  for (const x of o.preview || []) { const [px, py] = at(x); g += xMark(px, py, '--acc-ink', 3) + ringRect(px, py, '--acc-ink', 2, true); }
  for (const x of o.spot || []) { const [px, py] = at(x); g += ringRect(px, py, '--acc-ink', 3, true); }
  for (const x of o.conflict || []) { const [px, py] = at(x); g += ringRect(px, py, '--conflict', 3); }
  const piece = o.piece === 'star' ? 'star' : 'cat';
  const cats = [...(o.cats || []), ...(o.previewCat !== undefined && o.previewCat !== null ? [o.previewCat] : [])];
  for (const x of cats) {
    const [px, py] = at(x);
    const face = (o.faces && o.faces[x]) || 'normal';
    const cls = o.popCell === x ? ' class="pop-in"' : '';
    const ghost = x === o.previewCat ? ' opacity=".55"' : '';
    g += `<g${cls}${ghost} style="transform-origin:${px + S / 2}px ${py + S / 2}px"><use href="#${piece}-${piece === 'cat' ? face : 'normal'}" x="${px + 6}" y="${py + 6}" width="${S - 12}" height="${S - 12}"/></g>`;
  }
  if (o.sel !== undefined && o.sel !== null && o.sel >= 0) { const [px, py] = at(o.sel); g += `<rect x="${px + 2}" y="${py + 2}" width="${S - 4}" height="${S - 4}" rx="8" fill="none" style="stroke:var(--focus)" stroke-width="3"/>`; }

}

// 스도쿠 판. o: { n, puzzle, values, notes:[mask], sel, conflict:[칸], wrong:[칸], focus:[unit], spot:[칸], pick:[칸], elimPreview:[{x,mask}], placePreview:{x,d}, label, popCell }

  }

  for (let i = 1; i < n; i++) {

    if (i % br === 0) g += `<path d="M0,${i * S} H${W}" style="stroke:var(--grid-box)" stroke-width="2.5"/>`;
  }
  g += `<rect x="1.25" y="1.25" width="${W - 2.5}" height="${W - 2.5}" rx="4" fill="none" style="stroke:var(--grid-box)" stroke-width="2.5"/>`;
  for (const x of o.pick || []) { const [px, py] = at(x); g += ringRect(px, py, '--acc-ink', 3); }
  for (const x of o.spot || []) { const [px, py] = at(x); g += ringRect(px, py, '--acc-ink', 3, true); }
  if (sel !== null) { const [px, py] = at(sel); g += `<rect x="${px + 2.5}" y="${py + 2.5}" width="${S - 5}" height="${S - 5}" rx="6" fill="none" style="stroke:var(--focus)" stroke-width="3"/>`; }
  const elim = new Map((o.elimPreview || []).map((e) => [e.x, e.mask]));
  for (let x = 0; x < n * n; x++) {
    const [px, py] = at(x);
    const v = vals[x];
    if (v) {
      const given = Boolean(o.puzzle[x]);
      const isBad = bad.has(x);
      const cls = o.popCell === x ? ' class="pop-in"' : '';
      g += `<text${cls} x="${px + S / 2}" y="${py + S / 2 + fz * 0.36}" text-anchor="middle" style="transform-origin:${px + S / 2}px ${py + S / 2}px;fill:var(${isBad ? '--bad' : given ? '--digit-given' : '--digit-user'});font:${given ? 700 : 400} ${fz}px var(--font)">${v}</text>`;
      if (isBad) g += `<path d="M${px + S - 14},${py + 4} h10 v10 z" style="fill:var(--bad)"/>`;
      continue;
    }
    if (o.placePreview && o.placePreview.x === x) {
      g += `<text x="${px + S / 2}" y="${py + S / 2 + fz * 0.36}" text-anchor="middle" style="fill:var(--acc-ink);opacity:.7;font:400 ${fz}px var(--font)">${o.placePreview.d}</text>`;
      g += ringRect(px, py, '--acc-ink', 2, true);
      continue;
    }
    const m = o.notes ? o.notes[x] : 0;
    const em = elim.get(x) || 0;
    if (!m && !em) continue;
    const cols = n === 4 ? 2 : 3;
    const step = n === 4 ? 20 : 15;
    const ox = n === 4 ? 14 : 9, oy = (n === 4 ? 14 : 9) + memoPx * 0.36;
    for (let d = 1; d <= n; d++) {
      const b = 1 << (d - 1);
      if (!(m & b) && !(em & b)) continue;
      const i = d - 1, mx = i % cols, my = Math.floor(i / cols);
      const tx = px + ox + mx * step, ty = py + oy + my * step;
      if (em & b) {
        g += `<text x="${tx}" y="${ty}" text-anchor="middle" style="fill:var(--acc-ink);font:700 ${memoPx}px var(--font)">${d}</text><path d="M${tx - 6},${ty - 10} L${tx + 6},${ty + 2}" style="stroke:var(--acc-ink)" stroke-width="2" stroke-linecap="round"/>`;
      } else g += `<text x="${tx}" y="${ty}" text-anchor="middle" style="fill:var(--digit-memo);font:700 ${memoPx}px var(--font)">${d}</text>`;
    }
  }
  return `<svg class="board-svg" viewBox="0 0 ${W} ${W}" role="img" aria-label="${o.label || `스도쿠 ${n}×${n} 판`}" data-n="${n}">${g}</svg>`;
}

// 누른 자리 → 칸 번호
function boardCellAt(svg, clientX, clientY) {
  const n = Number(svg.dataset.n);
  const r = svg.getBoundingClientRect();
  const c = Math.floor(((clientX - r.left) / r.width) * n);
  const row = Math.floor(((clientY - r.top) / r.height) * n);
  if (c < 0 || c >= n || row < 0 || row >= n) return -1;
  return row * n + c;
}

// 판 위에 겹치는 칸 단추(누르기, 키보드 초점, 화면 읽기 이름). labels[x] = 칸 이름
function boardCellsHtml(n, labels, sel) {
  let h = '';
  const focusAt = sel !== null && sel !== undefined && sel >= 0 ? sel : 0;
  for (let x = 0; x < n * n; x++) h += `<button class="cellbtn" role="gridcell" data-act="cell" data-arg="${x}" tabindex="${x === focusAt ? 0 : -1}" aria-label="${labels[x]}"${x === focusAt ? ' data-roving' : ''}></button>`;
  return `<div class="cells" role="grid" aria-label="판 칸" style="grid-template-columns:repeat(${n},1fr)">${h}</div>`;
}

// ---- src/ui/game.js ----
// 판 하나를 푸는 상태와 동작(화면 그리기와 분리). 차시 문제, 오늘의 퍼즐, 자유 연습, 미션이 함께 쓴다.

// 새 판. src: { kind:'sd', n, puzzle, solution, values?, notes? } 또는 { kind:'ct', n, region, solution, cats?, marks? }
function newGame(src, opts = {}) {
  const g = {
    kind: src.kind, n: src.n, mode: opts.mode || 'free', sel: -1, memo: false, history: [],
    mistakes: 0, hints: 0, hearts: opts.challenge ? 3 : null, done: false, elapsed: opts.elapsed || 0, popCell: null,
  };
  if (src.kind === 'sd') {
    g.puzzle = src.puzzle.slice();
    g.solution = src.solution || sdSolution(src.puzzle);
    g.values = (src.values || src.puzzle).slice();
    g.notes = src.notes ? src.notes.slice() : new Array(src.n * src.n).fill(0);
    const firstEmpty = g.values.findIndex((v) => !v);
    g.sel = firstEmpty;
  } else {
    g.region = src.region.slice();
    g.solution = src.solution || ctSolution(src.n, src.region);
    g.cats = (src.cats || []).slice();
    g.marks = (src.marks || []).slice();
    g.given = (src.cats || []).slice();
    g.sel = 0;
  }
  return g;
}

function gameSnapshot(g) {
  return g.kind === 'sd' ? { values: g.values.slice(), notes: g.notes.slice() } : { cats: g.cats.slice(), marks: g.marks.slice() };
}
function gamePush(g) { g.history.push(gameSnapshot(g)); if (g.history.length > 200) g.history.shift(); }
function gameUndo(g) {
  const s = g.history.pop();
  if (!s) return false;
  Object.assign(g, s);
  g.popCell = null;
  return true;
}

// ── 스도쿠 ──
function sdPeersOf(n, x) { return sdShape(n).peers[x]; }
// 숫자 놓기. 돌려줌: 'placed' | 'note' | 'given' | 'wrong-challenge' | 'same'
function sdInput(g, d, settings) {
  const x = g.sel;
  if (x < 0 || g.done) return 'none';
  if (g.puzzle[x]) return 'given';
  if (g.memo) {
    if (g.values[x]) return 'none';
    gamePush(g);
    g.notes[x] ^= 1 << (d - 1);
    return 'note';
  }
  if (g.values[x] === d) return 'same';
  if (g.hearts !== null && d !== g.solution[x]) {
    g.hearts = Math.max(0, g.hearts - 1);
    g.mistakes++;
    return 'wrong-challenge';
  }
  gamePush(g);
  g.values[x] = d;
  g.notes[x] = 0;
  if (settings.autoClean) for (const p of sdPeersOf(g.n, x)) g.notes[p] &= ~(1 << (d - 1));
  g.popCell = x;
  if (sdConflicts(g.values).includes(x)) g.mistakes++;
  return 'placed';
}
function sdErase(g) {
  const x = g.sel;
  if (x < 0 || g.puzzle[x] || g.done) return false;
  if (!g.values[x] && !g.notes[x]) return false;
  gamePush(g);
  g.values[x] = 0; g.notes[x] = 0;
  return true;
}
function sdFillNotes(g) {
  gamePush(g);
  const auto = sdAutoNotes(g.values);
  g.notes = auto;
}
function sdWrongCells(g) { return g.values.map((v, x) => (v && !g.puzzle[x] && v !== g.solution[x] ? x : -1)).filter((x) => x >= 0); }
function sdIsDone(g) { return g.values.every((v, x) => v === g.solution[x]); }
function sdDigitLeft(g, d) { return g.n - g.values.filter((v) => v === d).length; }

// ── 고양이 자리 ──
// 한 번 누르면 ×, 두 번 누르면 고양이, 세 번이면 비움
function ctCycle(g, x) {
  if (g.done || g.given.includes(x)) return 'none';
  if (g.cats.includes(x)) { gamePush(g); g.cats = g.cats.filter((y) => y !== x); return 'cleared'; }
  if (g.marks.includes(x)) return ctPutCat(g, x);
  gamePush(g); g.marks.push(x); return 'marked';
}
function ctPutCat(g, x) {
  if (g.done || g.given.includes(x)) return 'none';
  if (g.hearts !== null && !g.solution.includes(x)) {
    g.hearts = Math.max(0, g.hearts - 1); g.mistakes++;
    return 'wrong-challenge';
  }
  gamePush(g);
  g.marks = g.marks.filter((y) => y !== x);
  if (!g.cats.includes(x)) g.cats.push(x);
  g.popCell = x;
  if (ctConflicts(g.n, g.region, g.cats).cells.includes(x)) g.mistakes++;
  return 'cat';
}
function ctToggleMark(g, x) {
  if (g.done || g.cats.includes(x)) return 'none';
  gamePush(g);
  if (g.marks.includes(x)) g.marks = g.marks.filter((y) => y !== x); else g.marks.push(x);
  return 'marked';
}
function ctClearCell(g, x) {
  if (g.done || g.given.includes(x)) return false;
  if (!g.cats.includes(x) && !g.marks.includes(x)) return false;
  gamePush(g);
  g.cats = g.cats.filter((y) => y !== x);
  g.marks = g.marks.filter((y) => y !== x);
  return true;
}
// 자동 점: 놓인 고양이 때문에 둘 수 없는 칸(사용자 × 와 겹치지 않게)
function ctAutoDots(g) {
  const s = new Set();
  for (const c of g.cats) for (const y of ctBlockedBy(g.n, g.region, c)) s.add(y);
  for (const c of g.cats) s.delete(c);
  for (const m of g.marks) s.delete(m);
  return [...s];
}
function ctIsDone(g) { return g.cats.length === g.n && ctConflicts(g.n, g.region, g.cats).cells.length === 0; }
function ctWrongCats(g) { return g.cats.filter((x) => !g.solution.includes(x)); }

function gameIsDone(g) { return g.kind === 'sd' ? sdIsDone(g) : ctIsDone(g); }
function gameConflicts(g) { return g.kind === 'sd' ? sdConflicts(g.values) : ctConflicts(g.n, g.region, g.cats).cells; }

// 힌트(3단계 자료). regionName: 구역 이름 함수
function gameHint(g, regionName) {
  if (g.kind === 'sd') return sdHint({ puzzle: g.puzzle, values: g.values, notes: g.notes.some(Boolean) ? g.notes : null, solution: g.solution });
  return ctHint({ n: g.n, region: g.region, cats: g.cats, marks: g.marks, solution: g.solution, regionName });
}
// 힌트 3단계 "이렇게 해요" 적용
function gameApplyHint(g, h, settings) {
  if (!h) return;
  if (h.kind === 'mistake') {
    gamePush(g);
    if (g.kind === 'sd') { const x = h.cells[0]; g.values[x] = 0; g.sel = x; } else { g.cats = g.cats.filter((y) => y !== h.remove); }
    return;
  }
  if (h.kind === 'note') {
    gamePush(g);
    if (g.kind === 'sd') { const x = h.cells[0]; if (h.elimNotes) for (const e of h.elimNotes) g.notes[e.x] &= ~e.mask; else g.notes[x] = 0; g.sel = x; } else g.marks = g.marks.filter((y) => y !== h.unmark);
    return;
  }
  if (h.kind !== 'step') return;
  if (g.kind === 'sd') {
    gamePush(g);
    // 후보 지우기: 메모가 없으면 먼저 메모를 채운 뒤 지운다(힌트가 그 메모에서 이어지도록)
    if ((h.elim || []).length && !h.memo) { const auto = sdAutoNotes(g.values); for (let k = 0; k < auto.length; k++) if (!g.notes[k]) g.notes[k] = auto[k]; }
    for (const e of h.elim || []) g.notes[e.x] &= ~e.mask;
    if (h.place) {
      const { x, d } = h.place;
      g.values[x] = d; g.notes[x] = 0; g.sel = x; g.popCell = x;
      if (settings.autoClean) for (const p of sdPeersOf(g.n, x)) g.notes[p] &= ~(1 << (d - 1));
    }
  } else {
    gamePush(g);
    for (const x of h.elim || []) if (!g.marks.includes(x)) g.marks.push(x);
    if (h.place !== null && h.place !== undefined) { g.marks = g.marks.filter((y) => y !== h.place); g.cats.push(h.place); g.popCell = h.place; }
  }
}

// 진행 저장용(작게)
function gameSave(g) {
  return g.kind === 'sd'
    ? { v: sdFormat(g.values), m: g.notes.join(','), t: Math.round(g.elapsed), h: g.hints, e: g.mistakes, hp: g.hearts, a: g.assisted ? 1 : 0 }
    : { c: g.cats.join(','), x: g.marks.join(','), t: Math.round(g.elapsed), h: g.hints, e: g.mistakes, hp: g.hearts, a: g.assisted ? 1 : 0 };
}
function gameRestore(g, s) {
  if (!s) return g;
  try {
    if (g.kind === 'sd' && typeof s.v === 'string' && s.v.length === g.n * g.n) {
      const vals = sdParse(s.v);
      if (vals.every((v, x) => !g.puzzle[x] || v === g.puzzle[x])) g.values = vals;
      const m = String(s.m || '').split(',').map(Number);
      if (m.length === g.n * g.n && m.every(Number.isFinite)) g.notes = m;
    }
    if (g.kind === 'ct') {
      const list = (t) => String(t || '').split(',').filter(Boolean).map(Number).filter((x) => x >= 0 && x < g.n * g.n);
      g.cats = list(s.c); g.marks = list(s.x);
    }
    g.elapsed = Number(s.t) || 0; g.hints = Number(s.h) || 0; g.mistakes = Number(s.e) || 0; g.assisted = s.a === 1;
    if (g.hearts !== null && Number.isInteger(s.hp)) g.hearts = s.hp;
  } catch (err) { /* 망가진 저장은 무시 */ }
  return g;
}

function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return (m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
}

// 주소(http, https)로 열었을 때만 서비스 워커를 올린다. 파일로 열면 원래부터 인터넷이 필요 없다.

function installCard() {
  if (!canOfferInstall()) return '';
  return `<div class="card tight install rise"><div class="t-body-b">앱처럼 쓰기</div><p class="t-small c-ink2">홈 화면에 담으면 주소창 없이 열리고, 인터넷이 없어도 열려요.</p><button class="btn secondary block" data-act="install">${icon('download')}홈 화면에 앱으로 설치</button></div>`;
}

// ── 주소 ──
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function parseHash() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  return { name: parts[0] || 'home', arg: decodeURIComponent(parts[1] || '') };
}
const TAB_OF = { home: 'home', path: 'home', practice: 'practice', records: 'records', more: 'more', settings: 'more', glossary: 'more', story: 'more', news: 'more' };

function route() {
  APP.route = parseHash();
  APP.sheet = null;
  const r = APP.route;
  if (!APP.store.current() && r.name !== 'welcome') { APP.route = { name: 'welcome', arg: '' }; }
  if (r.name === 'lesson' || r.name === 'mission') startLesson(r.arg);
  else if (r.name === 'daily') startDaily(r.arg);
  else if (r.name === 'free') { if (!APP.play || APP.play.ctx !== 'free') { APP.route = { name: 'practice', arg: '' }; } }
  else { stopPlay(); }
  render();
  window.scrollTo(0, 0);
}

function stopPlay() { APP.play = null; APP.lesson = null; }

// ── 공통 조각 ──
const avatarOf = (p) => `<span class="avatar c${p ? p.color % 5 : 0}">${uiEsc(p ? [...p.name][0] : '?')}</span>`;
function navHtml() {
  const tab = TAB_OF[APP.route.name] || 'home';
  const item = (id, ic, label, hash) => `<button data-act="nav" data-arg="${hash}"${tab === id ? ' aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></button>`;
  return `<nav class="nav" aria-label="주 메뉴">${item('home', 'home', '놀이터', '#/')}${item('practice', 'sparkle', '자유 연습', '#/practice')}${item('records', 'cal', '기록', '#/records')}${item('more', 'more', '더보기', '#/more')}</nav>`;
}
function appBar(title, { back = null, right = '' } = {}) {
  if (back) return `<header class="appbar with-back"><button class="iconbtn" data-act="nav" data-arg="${back}" aria-label="뒤로">${icon('back')}</button><h1 class="ttl">${uiEsc(title)}</h1>${right}</header>`;
  return `<header class="appbar"><span class="mark" aria-hidden="true">${pieceSvg('cat', 'normal', 26)}</span><h1 class="ttl">${uiEsc(title)}</h1>${right}</header>`;
}
const profileBtn = () => `<button class="iconbtn" data-act="profiles" aria-label="프로필 바꾸기">${avatarOf(APP.store.current())}</button>`;
function chip(text, cls = '') { return `<span class="chip ${cls}">${text}</span>`; }
function sw(k, label, sub = '') {
  return `<button class="li swrow" role="switch" aria-checked="${APP.settings[k]}" data-act="toggle" data-arg="${k}"><span class="grow"><span class="t-body">${label}</span>${sub ? `<br><span class="t-small c-sub">${sub}</span>` : ''}</span><span class="switch" aria-hidden="true"></span></button>`;
}
const LEVEL_LABEL = { easy: '쉬움', normal: '보통', hard: '어려움' };
const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
function dateLabel(d) { return `${d.getMonth() + 1}월 ${d.getDate()}일 ${DAY_NAMES[d.getDay()]}요일`; }

// ── 그리기 ──
function render() {
  const r = APP.route;
  let body;
  switch (r.name) {
    case 'welcome': body = screenWelcome(); break;
    case 'path': body = screenPath(r.arg); break;
    case 'lesson': case 'mission': body = APP.lesson ? screenLesson() : screenMissing(); break;
    case 'daily': case 'free': body = APP.play ? screenPlay() : screenMissing(); break;
    case 'practice': body = screenPractice(); break;
    case 'records': body = screenRecords(); break;
    case 'more': body = screenMore(); break;
    case 'settings': body = screenSettings(); break;
    case 'glossary': body = screenGlossary(); break;
    case 'story': body = screenStory(); break;
    case 'news': body = screenNews(); break;
    default: body = screenHome();
  }
  const tabbed = Boolean(TAB_OF[r.name]);
  appRoot.className = 'app' + (tabbed ? ' tabbed' : ' focus');
  const railOnly = !tabbed && APP.play && (r.name === 'daily' || r.name === 'free');
  appRoot.innerHTML = ICON_SPRITE + (tabbed ? `<div class="shell"><main class="main">${body}</main>${navHtml()}</div>` : railOnly ? `<div class="shell rail-only"><main class="main solo">${body}</main>${navHtml()}</div>` : `<main class="main solo">${body}</main>`) + overlayHtml();
  afterRender();
}
function afterRender() {
  const input = appRoot.querySelector('[data-autofocus]');
  if (input) input.focus();
  const overlayFocused = focusAfterRender();
  const P = APP.play;
  if (P && P.g) {
    P.g.popCell = null;
    const svg = appRoot.querySelector('[data-board] svg.board-svg');
    if (svg) {
      const w = svg.getBoundingClientRect().width;
      const k = w ? (P.g.n * 48) / w : 1;
      const prev = APP.boardScale[P.g.n];
      APP.boardScale[P.g.n] = k;
      if ((!prev || Math.abs(prev - k) > 0.05) && !APP.rescaled) { APP.rescaled = true; render(); APP.rescaled = false; return; }
    }
    if (APP.keepCellFocus && !overlayFocused) { const b = appRoot.querySelector('.cellbtn[data-roving]'); if (b) b.focus({ preventScroll: true }); }
  }
}
function screenMissing() {
  return `${appBar('찾을 수 없어요', { back: '#/' })}<div class="pad"><div class="state"><div class="ic">${icon('info')}</div><div class="t-sub">이 화면을 찾을 수 없어요</div><button class="btn secondary" data-act="nav" data-arg="#/">놀이터로</button></div></div>`;
}

// ── 처음 시작 ──
function screenWelcome() {

    <span class="mark lg" aria-hidden="true">${pieceSvg('cat', 'happy', 64)}</span>
    <div><div class="eyebrow">스도쿠 · 고양이 자리</div><h1 class="t-display">퍼즐 놀이터</h1></div>

    <form class="card welcome-form" data-form="welcome">

// ── 홈 ──
function todayDaily() {
  const date = todayKey();
  const level = APP.store.level();
  const key = date + ':' + level;
  if (!APP.dailyCache[key]) {
    const t0 = performance.now();
    APP.dailyCache[key] = dailyPuzzles(date, level);
    APP.genMs.push({ what: 'daily-' + level, ms: performance.now() - t0 });
  }
  return APP.dailyCache[key];
}
function screenHome() {
  const st = APP.store;
  const now = new Date();
  const date = todayKey(now);
  const level = st.level();
  // 기록은 날짜 × 난이도 × 퍼즐. 카드는 지금 고른 난이도, 아래 줄은 세 난이도를 한눈에
  const dayAll = st.dailyOf(date) || {};
  const rec = dayAll[level] || {};
  const flags = dayFlags(dayAll);
  const size = DAILY_SIZES[level];
  const isDone = (id) => st.isDone(id);
  const pathTile = (p) => {
    const prog = pathProgress(p.id, isDone);
    const dots = p.lessons.map((l, i) => {
      const cls = isDone(l.id) ? 'd' : (i === prog.done ? 'n' : '');
      return `<i class="${cls}"></i>`;
    }).join('');
    const ic = p.id === 'sd' ? icon('grid') : pieceSvg(APP.settings.piece, 'normal', 28);
    return `<button class="tile rise" data-act="nav" data-arg="#/path/${p.id}"><span class="ic">${ic}</span><span class="t-body-b">${p.title}</span><span class="pathdots" aria-hidden="true">${dots}</span><span class="t-small c-sub num">${prog.done} / ${prog.total} 차시</span></button>`;
  };
  const half = (which, label, n) => {
    const key = which === 'sd' ? 'sudoku' : 'cats';
    const sec = rec[key];
    const done = sec !== undefined;
    const help = done && rec[key + 'Help'];
    return `<button class="half${done ? ' done' : ''}" data-act="nav" data-arg="#/daily/${which}"><span class="mini" aria-hidden="true">${miniBoard(which, done)}</span><span class="t-body-b">${label} ${n}×${n}</span><span class="t-small ${done ? 'c-acc' : 'c-sub'} num">${done ? (help ? '힌트와 함께 다 했어요 · 다시 풀기' : fmtTime(sec) + '에 혼자 풀었어요 · 다시 풀기') : '아직 안 풀었어요 · 풀기'}</span></button>`;
  };
  const last = st.lastLesson();
  const contPath = last && last.startsWith('C') ? 'ct' : 'sd';
  const next = nextLesson(contPath, isDone) || nextLesson(contPath === 'sd' ? 'ct' : 'sd', isDone);
  const nextInfo = next ? findLesson(next.id) : null;
  const progress = ['sd', 'ct'].map((w) => st.progressOf(`daily-${w}-${date}-${level}`)).filter(Boolean).sort((a, b) => b.at - a.at)[0] || null;
  let cont = '';
  const progWhich = progress && /^daily-/.test(progress.key) && progress.key.includes(date) ? (progress.key.startsWith('daily-sd') ? 'sudoku' : 'cats') : null;
  if (progWhich && rec[progWhich] === undefined) {
    cont = contTile('이어서 하기', progress.key.startsWith('daily-sd') ? '오늘의 스도쿠' : '오늘의 고양이 자리', fmtTime(progress.state.t || 0) + ' 진행', '#/daily/' + (progress.key.startsWith('daily-sd') ? 'sd' : 'ct'));
  } else if (!st.totalStars() && !flags.sudoku && !flags.cats) {
    cont = `<div class="tile span2 rise"><div class="cont-row"><div class="grow"><div class="t-label c-acc">처음이에요</div><div class="t-sub">스도쿠 1차시부터 해 볼까요</div><div class="t-small c-sub">규칙을 익히고 오늘의 퍼즐로 가요</div></div><button class="btn primary" data-act="nav" data-arg="#/lesson/S01">시작하기</button></div></div>`;
  } else if (next) {
    const idx = nextInfo.index + 1;
    cont = contTile(st.totalStars() ? '이어서 하기' : '처음 시작', `${nextInfo.path.id === 'sd' ? '스도쿠' : '고양이 자리'} ${idx}차시 · ${next.title}`, `${next.size}×${next.size}`, '#/lesson/' + next.id);
  }
  const name = st.current() ? st.current().name : '';
  const doneBoth = rec.sudoku !== undefined && rec.cats !== undefined;
  return `${appBar('퍼즐 놀이터', { right: profileBtn() })}
  <div class="scroll">
    <div class="hello"><div class="eyebrow num">${dateLabel(now)}</div><div class="t-title">${doneBoth ? `${uiEsc(name)}님, 오늘 퍼즐을 다 풀었어요` : '오늘의 퍼즐이 도착했어요'}</div></div>
    <div class="bento">
      <div class="tile span2 rise">
        <div class="row-between"><span class="t-sub">오늘의 퍼즐</span><button class="chip btnchip" data-act="level" aria-label="오늘의 퍼즐 난이도 바꾸기">${LEVEL_LABEL[level]}${icon('chev', 's16')}</button></div>
        <div class="today">${half('sd', '스도쿠', size.sd)}${half('ct', '고양이 자리', size.ct)}</div>
        ${levelSummary(dayAll, level)}
      </div>
      ${cont}
      ${PATHS.map(pathTile).join('')}
    </div>
    <div class="sec-h"><span class="t-sub">더 놀기</span></div>
    <div class="list">
      <button class="li" data-act="nav" data-arg="#/practice">${icon('sparkle', 'c-ink2')}<span class="grow t-body">자유 연습</span><span class="val">크기·난이도 고르기</span>${icon('chev', 's20 c-sub')}</button>
      <button class="li" data-act="nav" data-arg="#/glossary">${icon('book', 'c-ink2')}<span class="grow t-body">용어 사전</span>${icon('chev', 's20 c-sub')}</button>
      <button class="li" data-act="nav" data-arg="#/story">${icon('info', 'c-ink2')}<span class="grow t-body">퍼즐 이야기</span>${icon('chev', 's20 c-sub')}</button>
    </div>
    ${installCard()}
    ${APP.store.canSave() ? '' : `<div class="banner" role="status">${icon('cloudoff')}<span>이 기기에서는 기록을 저장할 수 없어요. 창을 닫으면 기록이 사라져요.</span></div>`}
  </div>`;
}
// 오늘 난이도별 기록 한 줄: 「쉬움 ✓ · 보통 1/2 · 어려움」(✓ 두 퍼즐 모두, 1/2 하나)
function levelSummary(dayAll, cur) {
  const said = [];
  const items = LEVELS.map((lv) => {
    const e = dayAll[lv] || {};
    const n = (e.sudoku !== undefined ? 1 : 0) + (e.cats !== undefined ? 1 : 0);
    said.push(`${LEVEL_LABEL[lv]} ${n === 2 ? '두 퍼즐 모두 풂' : n === 1 ? (e.sudoku !== undefined ? '스도쿠 풂' : '고양이 자리 풂') : '아직'}`);
    return `<span class="lv${lv === cur ? ' cur' : ''}${n ? ' on' : ''}">${LEVEL_LABEL[lv]}${n === 2 ? icon('check', 's16') : n === 1 ? '<small class="num">1/2</small>' : ''}</span>`;
  });
  return `<div class="lvsum t-small" role="note" aria-label="오늘 난이도별 기록: ${said.join(', ')}"><span class="c-sub" aria-hidden="true">오늘 푼 것</span><span class="lvs" aria-hidden="true">${items.join('<i>·</i>')}</span></div>`;
}
function contTile(label, title, sub, hash) {
  return `<div class="tile span2 rise"><div class="cont-row"><div class="grow"><div class="t-label c-acc">${label}</div><div class="t-sub">${uiEsc(title)}</div><div class="t-small c-sub">${uiEsc(sub)}</div></div><button class="btn primary" data-act="nav" data-arg="${hash}">이어서</button></div></div>`;
}
function miniBoard(which, done = false) {
  const d = todayDaily();
  if (which === 'sd') return renderSudokuBoard({ n: d.sudoku.n, puzzle: d.sudoku.puzzle, values: done ? d.sudoku.solution : d.sudoku.puzzle, label: '오늘의 스도쿠 미리보기' });
  return renderCatsBoard({ n: d.cats.n, region: d.cats.region, cats: done ? d.cats.solution : [], faces: done ? Object.fromEntries(d.cats.solution.map((c) => [c, 'happy'])) : {}, piece: APP.settings.piece, pattern: APP.settings.pattern, label: '오늘의 고양이 자리 미리보기' });
}

// ── 길(차시 목록) ──
function screenPath(id) {
  const p = PATHS.find((x) => x.id === id) || PATHS[0];
  const st = APP.store;
  const isDone = (lid) => st.isDone(lid);
  const open = (lid) => isOpen(lid, isDone, APP.settings.openAll);
  const firstOpen = p.lessons.find((l) => !isDone(l.id) && open(l.id));
  let html = '';
  for (const u of p.units) {
    const lessons = p.lessons.filter((l) => l.unit === u.unit);
    const mission = p.missions.find((m) => m.unit === u.unit);
    html += `<section class="unit rise"><div class="unit-h"><span class="eyebrow">${u.unit}단원 · ${u.size}×${u.size}</span><h2 class="t-head">${uiEsc(u.title)}</h2></div><ol class="steps-list">`;
    for (const l of lessons) {
      const i = p.lessons.indexOf(l) + 1;
      const done = isDone(l.id), ok = open(l.id), now = firstOpen && firstOpen.id === l.id;
      const stars = st.starsOf(l.id);
      const right = done ? `<span class="stars" aria-label="별 ${stars}개">${[1, 2, 3].map((k) => `<svg class="i s16 ${k <= stars ? 'on' : ''}" aria-hidden="true"><use href="#i-star"/></svg>`).join('')}</span>` : ok ? icon('chev', 's20 c-sub') : icon('lock', 's20 c-sub');
      html += `<li><button class="stepbtn${done ? ' done' : ''}${now ? ' now' : ''}" ${ok ? `data-act="nav" data-arg="#/lesson/${l.id}"` : 'disabled aria-disabled="true"'}><span class="num-dot num">${done ? icon('check', 's16') : i}</span><span class="grow"><span class="t-body-b">${uiEsc(l.title)}</span><span class="t-small c-sub">${i}차시 · ${l.size}×${l.size}</span></span>${right}</button></li>`;
    }
    if (mission) {
      const ok = open(mission.id), done = st.missionDone(mission.id);
      html += `<li><button class="stepbtn mission${done ? ' done' : ''}" ${ok ? `data-act="nav" data-arg="#/mission/${mission.id}"` : 'disabled aria-disabled="true"'}><span class="num-dot">${icon('flag', 's16')}</span><span class="grow"><span class="t-body-b">단원 미션 · ${uiEsc(mission.title)}</span><span class="t-small c-sub">${done ? '배지를 받았어요' : ok ? '이 단원을 마무리해요' : '이 단원 차시를 다 마치면 열려요'}</span></span>${done ? chip('배지', 'acc') : ok ? icon('chev', 's20 c-sub') : icon('lock', 's20 c-sub')}</button></li>`;
    }
    html += '</ol></section>';
  }
  const prog = pathProgress(p.id, isDone);
  return `${appBar(p.title, { back: '#/' })}<div class="scroll"><div class="hello"><div class="eyebrow num">${prog.done} / ${prog.total} 차시 · 별 ${p.lessons.reduce((a, l) => a + st.starsOf(l.id), 0)}개</div><div class="seg" aria-hidden="true">${p.lessons.map((l) => `<i class="${isDone(l.id) ? 'done' : ''}"></i>`).join('')}</div></div>${html}</div>`;
}

// ── 차시 진행 ──
function startLesson(id) {
  if (APP.lesson && APP.lesson.id === id) return;
  const f = findLesson(id);
  if (!f) { APP.lesson = null; return; }
  const isDone = (lid) => APP.store.isDone(lid);
  if (!isOpen(id, isDone, APP.settings.openAll)) { APP.lesson = null; return; }
  const def = f.lesson || f.mission;
  const names = regionNamer();
  const steps = [];
  if (f.lesson) for (const c of def.cards) steps.push(expandItem({ t: 'card', ...c }, names));
  for (const it of def.items) steps.push(expandItem(it, names));
  APP.lesson = { id, def, path: f.path, isMission: Boolean(f.mission), steps, i: 0, mistakes: 0, hints: 0, finished: false };
  APP.play = null;
  setupStep();
}
function setupStep() {
  const L = APP.lesson;
  const x = L.steps[L.i];
  APP.play = null;
  if (!x || x.t === 'card' || x.t === 'quiz') return;
  const src = x.kind === 'sd' ? { kind: 'sd', n: x.n, puzzle: x.puzzle, solution: x.solution || sdSolution(x.puzzle) || x.puzzle, values: x.values, notes: x.notes } : { kind: 'ct', n: x.n, region: x.region, solution: x.solution || [], cats: x.cats, marks: x.marks };
  const g = newGame(src, { mode: 'lesson' });
  if (x.kind === 'sd' && (x.t === 'step' || x.t === 'memo' || x.t === 'count')) g.sel = x.spot && x.spot.length ? x.spot[0] : (x.answer && x.answer.place ? -1 : g.sel);
  if (x.kind === 'sd' && x.t === 'step' && x.answer.place) g.sel = x.spot && x.spot.length ? x.spot[0] : -1;
  if (x.t === 'memo') { g.memo = true; g.sel = x.answer.x; }
  if (x.t === 'tap' || (x.t === 'step' && x.answer.cells)) g.sel = -1;
  if (x.t === 'guided') g.guidedLeft = x.guided;
  APP.play = { ctx: 'lesson', g, x, hint: null, feedback: null, pick: [], answered: null };
}
function lessonNext() {
  const L = APP.lesson;
  if (L.i < L.steps.length - 1) { L.i++; setupStep(); render(); return; }
  finishLesson();
}
function finishLesson() {
  const L = APP.lesson;
  L.finished = true;
  const stars = starsFor(L.mistakes, L.hints);
  L.stars = stars;
  if (L.isMission) APP.store.completeMission(L.id); else APP.store.completeLesson(L.id, stars);
  APP.play = null;
  render();
}
function lessonMistake(title, text) {
  const P = APP.play;
  APP.lesson.mistakes++;
  P.feedback = { ok: false, title, text };
}
function lessonCorrect(text) {
  const P = APP.play;
  P.feedback = { ok: true, title: '맞았어요', text: text || '' };
  P.answered = true;
  if (P.g) P.g.done = true;
}

function screenLesson() {
  const L = APP.lesson;
  if (L.finished) return screenLessonDone();
  const x = L.steps[L.i];
  const total = L.steps.length;
  const seg = L.steps.map((_, k) => `<i class="${k < L.i ? 'done' : k === L.i ? 'now' : ''}"></i>`).join('');
  const f = findLesson(L.id);
  const title = L.isMission ? `단원 미션 · ${L.def.title}` : `${f.index + 1}차시 · ${L.def.title}`;
  const top = `<div class="qbar"><button class="iconbtn" data-act="quit" aria-label="그만두기">${icon('close')}</button><div class="seg" aria-label="${total}걸음 중 ${L.i + 1}번째">${seg}</div><span class="t-label c-sub num">${L.i + 1} / ${total}</span></div>`;
  if (x.t === 'card') return top + screenCard(x, title);

  } else data = gameHint(P.g, P.g.kind === 'ct' ? gameNamer(P.g) : null);
  if (data.kind === 'done') return;
  P.g.hints++;
  if (P.ctx === 'lesson') APP.lesson.hints++;
  P.hint = { level: 1, data };
  render();
}

const FOCUSABLE = 'button:not([disabled]), input, a[href], [tabindex]:not([tabindex="-1"]):not(use)';
function overlayEl() { return appRoot.querySelector('.dialog') || appRoot.querySelector('.sheet'); }
function trapTab(e) {
  const box = overlayEl();
  if (!box) return;
  const list = [...box.querySelectorAll(FOCUSABLE)];
  if (!list.length) return;
  const i = list.indexOf(document.activeElement);
  e.preventDefault();
  const next = e.shiftKey ? (i <= 0 ? list.length - 1 : i - 1) : (i < 0 || i === list.length - 1 ? 0 : i + 1);
  list[next].focus();
}
function focusAfterRender() {
  if (APP.restoreFocus && (APP.dialog || APP.sheet)) {

    if (el && overlayEl() && overlayEl().contains(el)) { APP.restoreFocus = null; el.focus({ preventScroll: true }); return true; }
  }
  const box = overlayEl();
  if (box) {
    if (APP.overlayFresh || !box.contains(document.activeElement)) {
      const first = box.querySelector('.field[name="name"]') && APP.formError ? box.querySelector('.field[name="name"]') : box.querySelector(FOCUSABLE);
      if (first) first.focus({ preventScroll: true });

  if (APP.restoreFocus) {
    const r = APP.restoreFocus;
    APP.restoreFocus = null;
    const sel = `[data-act="${r.act}"]${r.arg !== undefined ? `[data-arg="${r.arg}"]` : ''}`;
    const el = appRoot.querySelector(sel) || appRoot.querySelector(`[data-act="${r.act}"]`);

}

        return [['sudoku', '스도쿠'], ['cats', '고양이 자리']].map(([w, name]) => e[w] === undefined ? `<span class="st">${name} 아직</span>` : `<span class="st on">${icon('check', 's16')}${name} ${e[w + 'Help'] ? '힌트와 함께' : `<span class="num">${fmtTime(e[w])}</span>`}</span>`).join('');
      };
      const row = (lv, desc) => `<button class="li choice" data-act="setlevel" data-arg="${lv}" aria-pressed="${cur === lv}"><span class="grow"><span class="t-body-b">${LEVEL_LABEL[lv]}</span><br><span class="t-small c-sub">${desc}</span><span class="lvstat t-small">${status(lv)}</span></span>${cur === lv ? icon('check', 'c-acc') : ''}</button>`;
      return `<div class="t-head">오늘의 퍼즐 난이도</div><p class="t-small c-sub">같은 난이도를 고른 가족은 같은 문제를 받아요.</p><div class="list sheet-list">${row('easy', '스도쿠 6×6 · 고양이 자리 6×6')}${row('normal', '스도쿠 9×9 · 고양이 자리 7×7')}${row('hard', '스도쿠 9×9 · 고양이 자리 8×8')}</div>`;
    },
  };
}
// 되돌릴 수 없는 일만 묻는다. 취소 단추 이름은 부르는 곳마다("계속 풀기" 등), 위험한 확인은 위험색.
function confirmDialog(title, text, okLabel, onOk, danger = false, cancelLabel = '그대로 두기') {
  const a = document.activeElement && document.activeElement.closest ? document.activeElement.closest('[data-act]') : null;
  APP.dialogOpener = a ? { act: a.dataset.act, arg: a.dataset.arg } : null;
  if (!APP.dialog && !APP.sheet) openOverlay(); else APP.overlayFresh = true;
  APP.dialog = { html: `<div class="t-head" id="dlg-t">${uiEsc(title)}</div><p class="t-body c-ink2">${uiEsc(text)}</p><div class="acts"><button class="btn secondary" data-act="closedialog">${uiEsc(cancelLabel)}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-act="dialogok">${uiEsc(okLabel)}</button></div>`, onOk };
  render();
}

// ── 누르기 처리 ──
appRoot.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  if (act === 'import') return;
  const P = APP.play;
  switch (act) {
    case 'nav': APP.sheet = null; go(arg); return;
    case 'cell': APP.keepCellFocus = e.detail === 0; onBoardTap(Number(arg)); return;
    case 'profiles': openOverlay(); APP.formError = ''; APP.sheet = profileSheet(); render(); return;
    case 'level': openOverlay(); APP.sheet = levelSheet(); render(); return;
    case 'playmore': openOverlay(); APP.sheet = playMoreSheet(); render(); return;
    case 'closesheet': closeOverlay(); APP.sheet = null; render(); return;
    case 'install': doInstall(); return;
    case 'closedialog': APP.dialog = null; if (!APP.sheet) closeOverlay(); else APP.restoreFocus = APP.dialogOpener; render(); return;
    case 'dialogok': { const fn = APP.dialog && APP.dialog.onOk; APP.dialog = null; if (fn) fn(); if (!APP.sheet && !APP.dialog) closeOverlay(); render(); return; }
    case 'setlevel': APP.store.setLevel(arg); APP.sheet = null; closeOverlay(); render(); return;
    case 'selectprofile': APP.store.selectProfile(arg); APP.sheet = null; stopPlay(); go('#/'); render(); return;
    case 'removeprofile': {
      const p = APP.store.profiles().find((q) => q.id === arg);
      confirmDialog(`${p.name} 프로필을 지울까요`, '이 프로필의 차시 기록과 오늘의 퍼즐 기록이 모두 지워져요. 되돌릴 수 없어요.', '지우기', () => { APP.store.removeProfile(arg); APP.sheet = APP.store.profiles().length ? profileSheet() : null; if (!APP.store.current()) go('#/welcome'); }, true, '그대로 두기');
      return;
    }
    case 'toggle': setSetting(arg, !APP.settings[arg]); APP.glossaryHtml = null; render(); return;
    case 'set': { const [k, v] = arg.split(':'); setSetting(k, v); APP.glossaryHtml = null; render(); return; }
    case 'month': { const now = new Date(); const m = APP.month || { y: now.getFullYear(), m: now.getMonth() }; const d = new Date(m.y, m.m + Number(arg), 1); APP.month = { y: d.getFullYear(), m: d.getMonth() }; render(); return; }
    case 'export': doExport(); return;
    case 'pr-kind': APP.practice.kind = arg; APP.practice.n = arg === 'sd' ? 9 : 6; render(); return;
    case 'pr-n': APP.practice.n = Number(arg); render(); return;
    case 'pr-level': APP.practice.level = arg; render(); return;
    case 'freestart': case 'freeagain': {
      APP.making = true; render();
      setTimeout(() => { APP.making = false; startFree(); }, 30);
      return;
    }
    case 'quit': confirmDialog('차시를 그만둘까요', '지금까지 푼 걸음은 저장되지 않아요. 다음에 처음부터 다시 해요.', '그만두기', () => { const id = APP.lesson.path.id; stopPlay(); go('#/path/' + id); }, true, '계속 풀기'); return;
    case 'next': if (APP.lesson) lessonNext(); return;
    default: break;
  }
  if (!P) return;
  const g = P.g;
  switch (act) {
    case 'choose': {
      const k = Number(arg), x = P.x;
      P.chosen = k;
      if (k === x.answer.choice) lessonCorrect(x.explain); else lessonMistake('다시 해 봐요', x.t === 'count' ? '가로줄, 세로줄, 상자에 이미 있는 숫자를 지우고 남은 것을 세어 봐요.' : x.explain);
      render(); return;
    }
    case 'dismiss': P.feedback = null; P.chosen = null; render(); return;
    case 'digit': onDigit(Number(arg)); return;
    case 'erase': if (g.kind === 'sd' ? sdErase(g) : ctClearCell(g, g.sel)) afterMove(); else render(); return;
    case 'memo': g.memo = !g.memo; render(); return;
    case 'undo': if (gameUndo(g)) onGameChanged(); return;
    case 'fillnotes': APP.sheet = null; closeOverlay(); sdFillNotes(g); P.hint = null; onGameChanged(); return;
    case 'restart': APP.sheet = null; confirmDialog('처음부터 다시 할까요', '놓은 수와 표시가 모두 지워져요.', '처음부터', () => {
      const fresh = newGame(g.kind === 'sd' ? { kind: 'sd', n: g.n, puzzle: g.puzzle, solution: g.solution, values: P.x && P.x.values ? P.x.values : g.puzzle, notes: P.x && P.x.notes } : { kind: 'ct', n: g.n, region: g.region, solution: g.solution, cats: g.given }, { mode: g.mode, challenge: g.hearts !== null });
      fresh.elapsed = g.elapsed; fresh.hints = g.hints; fresh.mistakes = g.mistakes; fresh.guidedLeft = g.guidedLeft;
      P.g = fresh; P.hint = null; P.feedback = null; P.showWrong = false;
      if (P.ctx !== 'lesson') APP.store.saveProgress(P.ctx === 'daily' ? P.key : 'free', gameSave(fresh));
    }, true, '계속 풀기'); return;
    case 'continuenohearts': g.hearts = null; render(); return;
    case 'checkboard': {
      if (APP.sheet) { APP.sheet = null; closeOverlay(); }
      const wrong = g.kind === 'sd' ? sdWrongCells(g) : ctWrongCats(g);
      if (wrong.length) { P.showWrong = true; g.mistakes++; if (P.ctx === 'lesson') APP.lesson.mistakes++; toast(g.kind === 'sd' ? `다시 볼 칸이 ${wrong.length}개 있어요.` : `자리가 맞지 않는 고양이가 ${wrong.length}마리 있어요.`); }
      else toast('지금까지 놓은 것은 모두 맞아요.');
      render(); return;
    }
    case 'checkpick': {
      const x = P.x;
      if (!P.pick.length) { toast('칸을 골라요.'); return; }
      if (checkPick(x.answer, P.pick)) lessonCorrect(x.explain);
      else { const want = new Set(x.answer.cells); const miss = x.answer.cells.filter((c) => !P.pick.includes(c)).length; const extra = P.pick.filter((c) => !want.has(c)).length; lessonMistake('다시 해 봐요', `${extra ? `고르면 안 되는 칸이 ${extra}개, ` : ''}${miss ? `빠진 칸이 ${miss}개 있어요.` : '나머지는 맞아요.'}`); }
      render(); return;
    }
    case 'clearpick': P.pick = []; P.feedback = null; render(); return;
    case 'checkmemo': {
      const x = P.x;
      if (g.notes[x.answer.x] === x.answer.mask) lessonCorrect(x.explain);
      else lessonMistake('다시 해 봐요', '같은 가로줄, 세로줄, 상자에 이미 있는 숫자는 빼고, 나머지는 모두 적어요.');
      render(); return;
    }
    case 'hint': openHint(); return;
    case 'hintmore': P.hint.level++; render(); return;
    case 'hintclose': P.hint = null; render(); return;
    case 'hintapply': { const h = P.hint.data; gameApplyHint(g, h, APP.settings); if (h.kind === 'step') g.assisted = true; P.hint = null; if (g.guidedLeft > 0 && h.place) g.guidedLeft--; onGameChanged(); return; }
    case 'coachapply': { const c = P.coach; if (c) { gameApplyHint(g, c, APP.settings); } onGameChanged(); return; }
    default: break;
  }
});
appRoot.addEventListener('change', (e) => {
  if (e.target.dataset.act !== 'import') return;
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    confirmDialog('기록을 바꿀까요', '이 기기의 기록이 파일의 기록으로 바뀌어요. 지금 기록은 되돌릴 수 없어요.', '바꾸기', () => {
      const r = APP.store.importBackup(String(reader.result));
      const msg = { format: '기록 파일이 아니에요.', app: '퍼즐 놀이터의 기록 파일이 아니에요.', profiles: '파일 안의 프로필 자료가 망가져 있어요.', 'too-many': '프로필이 5명보다 많아요.' };
      toast(r.ok ? `프로필 ${r.count}명의 기록을 가져왔어요.` : msg[r.error] || '가져오지 못했어요.');
    });
  };
  reader.readAsText(file);
  e.target.value = '';
});
appRoot.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  let name = form.querySelector('input[name="name"]').value;
  // 첫 시작은 이름을 비워도 된다(「나」 프로필)
  if (form.dataset.form === 'welcome' && !cleanName(name)) name = '나';
  const r = APP.store.addProfile(name);
  if (r.error) { APP.formError = { empty: '이름을 적어 주세요.', full: '프로필은 5명까지예요.', duplicate: '같은 이름이 이미 있어요. 다른 이름을 적어 주세요.' }[r.error]; render(); return; }
  APP.formError = '';
  if (form.dataset.form === 'welcome') { APP.settings = saveSettings(uiStorage, { ...APP.settings, seen: APP_VERSION }); go('#/'); return; }
  APP.sheet = null; stopPlay(); go('#/'); render();
});
document.addEventListener('keydown', onKey);
window.addEventListener('hashchange', route);
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (APP.settings.theme === 'auto') applyTheme(); });

function doExport() {
  const data = JSON.stringify(APP.store.exportBackup(), null, 1);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `퍼즐놀이터_기록_${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('기록 파일을 내려받았어요.');
}

// 시간: 화면이 보일 때만 센다
setInterval(() => {
  const P = APP.play;
  if (!P || !P.g || P.g.done || P.result || document.visibilityState !== 'visible' || APP.dialog) return;
  if (P.ctx === 'lesson') return;
  P.g.elapsed++;
  const el = appRoot.querySelector('[data-timer]');
  if (el) el.textContent = fmtTime(P.g.elapsed);
  if (P.g.elapsed % 10 === 0) APP.store.saveProgress(P.ctx === 'daily' ? P.key : 'free', gameSave(P.g));
}, 1000);

// 시작
applyTheme();
APP.store.pruneProgress(todayKey());
if (shouldShowNews(APP.settings, APP.store.profiles().length > 0)) {
  APP.dialog = { html: `<div class="t-head">새로 생긴 것</div>${newsList(newsSince(APP.settings.seen))}<div class="acts"><button class="btn primary" data-act="dialogok">좋아요</button></div>`, onOk: () => setSetting('seen', APP_VERSION) };
} else if (!APP.store.profiles().length) APP.settings = saveSettings(uiStorage, { ...APP.settings, seen: APP_VERSION });
// 화면 점검·생성 시간 측정용(앱 동작에는 쓰지 않음)
window.__puzzleGuide = { APP, INSTALL, version: APP_VERSION, gen: { practiceCats, practiceSudoku, dailyPuzzles } };
route();

})();
</script>
