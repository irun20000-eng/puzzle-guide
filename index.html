/* ==========================================================================
   퍼즐 놀이터 · 디자인 토큰 (방향: 「먹과 종이」 / 퍼즐 = 경쾌·놀이)
   출처: 디자인 명세 DESIGN.md
   쓰는 법: 이 파일을 그대로 style.css 맨 위에 붙인다. 화면 CSS에는 hex를 쓰지 않고 var()만 쓴다.
   테마: 기본은 기기 설정. <html data-theme="light|dark">가 있으면 그것을 따른다.
   ========================================================================== */

/* ---------- 1. 가족 공통(체스 첫걸음과 같은 값) ---------- */
:root{
  color-scheme: light;

  --canvas:      #F6F5F2;
  --surface:     #FFFFFF;
  --surface-2:   #EFEEEA;
  --surface-3:   #E6E4DF;
  --hair:        #E2E0DA;
  --hair-strong: #C9C6BE;
  --ink:         #1A1917;   /* 16.11:1 */
  --ink-2:       #4A4844;   /* 8.37:1 */
  --sub:         #67645E;   /* 5.41:1 */
  --scrim:       rgba(20,19,17,.44);

  --ok:        #1E7F55;  --ok-soft:  #E3F3EA;
  --bad:       #C2352B;  --bad-soft: #FBE8E5;
  --on-status: #FFFFFF;

  --font: "PD", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --fs-display: 40px;  --lh-display: 1.1;  --ls-display: -0.03em;
  --fs-title:   28px;  --lh-title:   1.22; --ls-title:   -0.025em;
  --fs-head:    22px;  --lh-head:    1.3;  --ls-head:    -0.02em;
  --fs-sub:     18px;  --lh-sub:     1.4;  --ls-sub:     -0.01em;
  --fs-btn:     17px;  --lh-btn:     1.2;
  --fs-body:    16px;  --lh-body:    1.55;
  --fs-small:   14px;  --lh-small:   1.45; --ls-label: 0.01em;
  --fw-regular: 400;   --fw-bold: 700;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
  --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px; --sp-16: 64px;
  --gutter: 20px;
  --gutter-board: 12px;

  --tap: 48px; --tap-lg: 56px; --bar-h: 56px; --dock-h: 64px;

  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-full: 999px;

  --ring-hair:   inset 0 0 0 1px var(--hair);
  --ring-strong: inset 0 0 0 1px var(--hair-strong);
  --ring-focus:  0 0 0 2px var(--canvas), 0 0 0 4px var(--focus);

  --ease-out:   cubic-bezier(.23,1,.32,1);
  --ease-move:  cubic-bezier(.65,0,.35,1);
  --ease-sheet: cubic-bezier(.32,.72,0,1);
  --spring:     linear(0, .25 7%, .62 15%, .92 24%, 1.06 33%, 1.07 40%, 1.03 50%, .995 62%, 1 76%, 1);
  --t-press: 120ms; --t-small: 180ms; --t-enter: 240ms; --t-sheet: 280ms; --t-pop: 360ms;
  --stagger: 60ms;
}

/* ---------- 2. 퍼즐 전용 ---------- */
:root{
  /* 2-1 행동색 1개: 귤색. 글자는 먹색(흰 글자 아님) */
  --acc:      #EE5A28;   /* 주 단추 면. 먹 글자 5.13, canvas 대비 3.14 */
  --on-acc:   #1A1917;
  --acc-ink:  #A93C12;   /* 강조 글자·내가 넣은 숫자. 흰 면 6.1, acc-soft 위 5.18 */
  --acc-soft: #FFE4D6;   /* 선택 칸, 강조 면 */
  --focus:    #A93C12;

  /* 2-2 스도쿠 판 */
  --grid-cell:  #FFFFFF;
  --grid-line:  #D9D6CF;   /* 칸 사이 1px */
  --grid-box:   #3B3936;   /* 상자 경계 2px, 판 바깥 2px */
  --digit-given:#1A1917;   /* 처음 주어진 숫자 700 */
  --digit-user: #A93C12;   /* 내가 넣은 숫자 700 */
  --digit-memo: #4A4844;   /* 메모 숫자 700 */
  --cell-peer:  #EFEEEA;   /* 같은 줄·상자 */
  --cell-same:  #FFD3BD;   /* 같은 숫자 */
  --cell-sel:   #FFE4D6;   /* 선택 칸 면 + 2px acc 안쪽 선 */

  /* 2-3 고양이 자리 구역 색 10개 (면 + 무늬 + 명도). 순서 = 생성기가 주는 구역 번호 */
  --zone-1:#F6D69A;  --zone-2:#BFE0F5;  --zone-3:#A8DCC6;  --zone-4:#F3EC9E;  --zone-5:#A9C6EA;
  --zone-6:#F5BE9F;  --zone-7:#EBC0D8;  --zone-8:#D8D5CE;  --zone-9:#DCC6A6;  --zone-10:#C7C3E8;
  --zone-pattern: rgba(26,25,23,.16);  /* 무늬 선·점 */
  --zone-edge:    #3B3936;             /* 구역 경계 3px */
  --zone-line:    rgba(26,25,23,.14);  /* 같은 구역 칸 사이 1px */
  --cat-body:  #2A2826;  --cat-shade:#1A1917;  --cat-eye:#F6F5F2;  --cat-nose:#EE5A28;
  --mark-x:    #4A4844;                /* × 표시 (모든 구역 위 5.19 이상) */
  --conflict:  #C2352B;                /* 닿는 고양이·겹친 숫자 */

  /* 2-4 퍼즐의 개성 값 */
  --r-card: var(--r-xl);      /* 카드 24 */
  --r-btn:  var(--r-full);    /* 단추 알약 */
  --r-board: var(--r-lg);     /* 판 받침 16 */
  --track-eyebrow: 0.02em;
}

/* ---------- 3. 어두운 화면 ---------- */
:root[data-theme="dark"]{
  color-scheme: dark;
  --canvas:#121211; --surface:#1C1B1A; --surface-2:#262523; --surface-3:#302F2C;
  --hair:#33322F; --hair-strong:#4A4844;
  --ink:#F1EFEA; --ink-2:#C9C6BE; --sub:#A29F98; --scrim:rgba(0,0,0,.56);
  --ok:#5FD39A; --ok-soft:#17291F; --bad:#FF8A80; --bad-soft:#33201D; --on-status:#121211;

  --acc:#FF8A5B; --on-acc:#121211; --acc-ink:#FF9D74; --acc-soft:#3A2219; --focus:#FF9D74;
  --grid-cell:#1C1B1A; --grid-line:#3A3936; --grid-box:#C9C6BE;
  --digit-given:#F1EFEA; --digit-user:#FF9D74; --digit-memo:#C9C6BE;
  --cell-peer:#262523; --cell-same:#4A2A1C; --cell-sel:#3A2219;
  --zone-1:#6B4E1E; --zone-2:#2D5A73; --zone-3:#1F5E4B; --zone-4:#66601F; --zone-5:#2B4A7A;
  --zone-6:#7A3F25; --zone-7:#6E3A5A; --zone-8:#4A4844; --zone-9:#5E4A33; --zone-10:#4B4775;
  --zone-pattern:rgba(244,241,234,.16); --zone-edge:#E6E2DA; --zone-line:rgba(244,241,234,.14);
  --cat-body:#F4F1EA; --cat-shade:#D8D4CC; --cat-eye:#1A1917; --cat-nose:#FF8A5B;
  --mark-x:#D8D4CC; --conflict:#FF8A80;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --canvas:#121211; --surface:#1C1B1A; --surface-2:#262523; --surface-3:#302F2C;
    --hair:#33322F; --hair-strong:#4A4844;
    --ink:#F1EFEA; --ink-2:#C9C6BE; --sub:#A29F98; --scrim:rgba(0,0,0,.56);
    --ok:#5FD39A; --ok-soft:#17291F; --bad:#FF8A80; --bad-soft:#33201D; --on-status:#121211;
    --acc:#FF8A5B; --on-acc:#121211; --acc-ink:#FF9D74; --acc-soft:#3A2219; --focus:#FF9D74;
    --grid-cell:#1C1B1A; --grid-line:#3A3936; --grid-box:#C9C6BE;
    --digit-given:#F1EFEA; --digit-user:#FF9D74; --digit-memo:#C9C6BE;
    --cell-peer:#262523; --cell-same:#4A2A1C; --cell-sel:#3A2219;
    --zone-1:#6B4E1E; --zone-2:#2D5A73; --zone-3:#1F5E4B; --zone-4:#66601F; --zone-5:#2B4A7A;
    --zone-6:#7A3F25; --zone-7:#6E3A5A; --zone-8:#4A4844; --zone-9:#5E4A33; --zone-10:#4B4775;
    --zone-pattern:rgba(244,241,234,.16); --zone-edge:#E6E2DA; --zone-line:rgba(244,241,234,.14);
    --cat-body:#F4F1EA; --cat-shade:#D8D4CC; --cat-eye:#1A1917; --cat-nose:#FF8A5B;
    --mark-x:#D8D4CC; --conflict:#FF8A80;
  }
}

/* ---------- 4. 움직임 줄이기 ---------- */
@media (prefers-reduced-motion: reduce){
  :root{ --t-press:0ms; --t-small:0ms; --t-enter:0ms; --t-sheet:0ms; --t-pop:0ms; --stagger:0ms; }
}
/* 토큰 보탬(DESIGN.md 12절): 대비 높이기 설정에서 머리카락 선을 진하게, 구역 무늬를 .28로. 값은 tokens.css 의 같은 색을 쓴다. */
@media (prefers-contrast: more){
  :root{--hair:var(--hair-strong);--zone-pattern:rgba(26,25,23,.28)}
  :root[data-theme="dark"]{--zone-pattern:rgba(244,241,234,.28)}
}
/* 퍼즐 놀이터 화면 CSS. 색·간격·글자 값은 tokens.css(tokens-puzzle.css)의 var()만 쓴다. hex 금지. */

/* ===== 바탕 ===== */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;font-synthesis:none;background:var(--canvas)}
body{font-family:var(--font);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--ink);background:var(--canvas);
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
h1,h2,h3{font-weight:var(--fw-bold)}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.s20{width:20px;height:20px}
svg.i.s16{width:16px;height:16px;stroke-width:2}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 글자 단계 */
.t-display{font-size:var(--fs-display);line-height:var(--lh-display);letter-spacing:var(--ls-display);font-weight:var(--fw-bold)}
.t-title{font-size:var(--fs-title);line-height:var(--lh-title);letter-spacing:var(--ls-title);font-weight:var(--fw-bold);text-wrap:balance}
.t-head{font-size:var(--fs-head);line-height:var(--lh-head);letter-spacing:var(--ls-head);font-weight:var(--fw-bold);text-wrap:balance}
.t-sub{font-size:var(--fs-sub);line-height:var(--lh-sub);letter-spacing:var(--ls-sub);font-weight:var(--fw-bold)}
.t-body{font-size:var(--fs-body);line-height:var(--lh-body)}
.t-body-b{font-size:var(--fs-body);line-height:var(--lh-body);font-weight:var(--fw-bold)}
.t-small{font-size:var(--fs-small);line-height:var(--lh-small)}
.t-label{font-size:var(--fs-small);line-height:var(--lh-small);font-weight:var(--fw-bold);letter-spacing:var(--ls-label)}
.eyebrow{font-size:var(--fs-small);line-height:var(--lh-small);font-weight:var(--fw-bold);letter-spacing:var(--track-eyebrow);color:var(--sub)}
.c-sub{color:var(--sub)} .c-ink2{color:var(--ink-2)} .c-acc{color:var(--acc-ink)} .c-ok{color:var(--ok)} .c-bad{color:var(--bad)}

/* ===== 틀 ===== */
.app{min-height:100vh;min-height:100dvh}
.shell{min-height:100vh;min-height:100dvh}
.main{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.tabbed .main{padding-bottom:calc(var(--dock-h) + var(--sp-8) + env(safe-area-inset-bottom))}
.scroll{padding:0 var(--gutter) var(--sp-8);display:flex;flex-direction:column}
.pad{padding:var(--sp-6) var(--gutter)}

/* 앱 바 */
.appbar{height:var(--bar-h);flex:none;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-2) 0 var(--gutter);position:sticky;top:0;background:var(--canvas);z-index:5}
.appbar.with-back{padding-left:var(--sp-1)}
.appbar .ttl{flex:1;min-width:0;font-size:var(--fs-sub);font-weight:var(--fw-bold);letter-spacing:var(--ls-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{width:32px;height:32px;border-radius:var(--r-sm);background:var(--acc);display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
.mark.lg{width:96px;height:96px;border-radius:var(--r-xl)}
.mark.lg svg{width:72px;height:72px}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:var(--r-full);display:grid;place-items:center;color:var(--ink);flex:none;
  transition:transform var(--t-press) var(--ease-out),background-color var(--t-small) var(--ease-out)}
.iconbtn:active{transform:scale(.94);background:var(--surface-2)}
.iconbtn.flip svg{transform:none}
.avatar{width:36px;height:36px;border-radius:var(--r-full);background:var(--acc-soft);color:var(--acc-ink);display:grid;place-items:center;font-size:var(--fs-small);font-weight:var(--fw-bold);flex:none}

/* 주 메뉴: 좁은 화면은 떠 있는 독, 넓은 화면은 왼쪽 레일 */
.nav{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - var(--gutter) * 2);max-width:520px;bottom:calc(var(--sp-4) + env(safe-area-inset-bottom));height:var(--dock-h);border-radius:var(--r-full);
  background:var(--surface);box-shadow:var(--ring-strong);display:flex;padding:var(--sp-1);gap:var(--sp-1);z-index:20}
.nav button{flex:1;min-width:0;border-radius:var(--r-full);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-1);color:var(--sub);
  font-size:var(--fs-small);font-weight:var(--fw-bold);line-height:1.2;transition:background-color var(--t-small) var(--ease-out),color var(--t-small) var(--ease-out)}
.nav button[aria-current]{background:var(--acc-soft);color:var(--acc-ink)}

/* 단추 */
.btn{min-height:var(--tap);padding:0 var(--sp-5);border-radius:var(--r-btn);display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  font-size:var(--fs-btn);line-height:var(--lh-btn);font-weight:var(--fw-bold);white-space:nowrap;
  transition:transform var(--t-press) var(--ease-out),opacity var(--t-small) var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn.primary{min-height:var(--tap-lg);background:var(--acc);color:var(--on-acc)}
.btn.secondary{background:var(--surface-2);color:var(--ink)}
.btn.tonal{background:var(--acc-soft);color:var(--acc-ink)}
.btn.text{padding:0 var(--sp-2);min-width:var(--tap);color:var(--ink-2);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;text-decoration-color:var(--hair-strong);align-self:center}
.btn.small{font-size:var(--fs-small)}
.btn.danger{background:var(--bad);color:var(--on-status)}
.btn.block{width:100%}
.btn[disabled]{opacity:.38;pointer-events:none}

/* 카드·칩·목록 */
.card{background:var(--surface);border-radius:var(--r-card);padding:var(--sp-5)}
.card.tight{padding:var(--sp-4)}
.chip{display:inline-flex;align-items:center;gap:var(--sp-1);height:28px;padding:0 var(--sp-3);border-radius:var(--r-full);background:var(--surface-2);color:var(--ink-2);font-size:var(--fs-small);font-weight:var(--fw-bold);white-space:nowrap}
.chip.acc{background:var(--acc-soft);color:var(--acc-ink)}
.chip.btnchip{height:var(--tap);padding:0 var(--sp-3) 0 var(--sp-4);margin:calc(var(--sp-2) * -1) 0}
.list{background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.list .li{width:100%;min-height:var(--tap-lg);display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4);position:relative;text-align:left;flex-wrap:wrap}
.list .li.tall{padding:var(--sp-3) var(--sp-4)}
.list .li + .li::before{content:"";position:absolute;left:var(--sp-4);right:0;top:0;height:1px;background:var(--hair)}
.list .li .grow{flex:1;min-width:0}
.list .li .val{color:var(--sub);font-size:var(--fs-small)}
.list button.li:active,.list label.li:active{background:var(--surface-2)}
.list label.li{cursor:pointer}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-3);margin:var(--sp-8) 0 var(--sp-3)}
.sec-h.first{margin-top:var(--sp-4)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3)}
.grow{flex:1;min-width:0}
.banner{display:flex;gap:var(--sp-3);align-items:center;margin-top:var(--sp-6);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);background:var(--bad-soft);color:var(--bad);font-size:var(--fs-small);font-weight:var(--fw-bold)}

/* 스위치 · 분할 단추 */
.swrow{min-height:64px}
.switch{width:52px;height:32px;border-radius:var(--r-full);background:var(--surface-3);position:relative;flex:none;box-shadow:inset 0 0 0 2px var(--sub)}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:var(--r-full);background:var(--surface);box-shadow:var(--ring-strong);transition:transform var(--t-small) var(--ease-out)}
[aria-checked="true"] > .switch{background:var(--acc);box-shadow:none}
[aria-checked="true"] > .switch::after{transform:translateX(20px);box-shadow:none}
.segctl{display:flex;background:var(--surface-2);border-radius:var(--r-full);padding:var(--sp-1);gap:var(--sp-1);flex-wrap:wrap}
.segctl button{min-height:var(--tap);min-width:var(--tap);padding:0 var(--sp-3);border-radius:var(--r-full);font-size:var(--fs-small);font-weight:var(--fw-bold);color:var(--ink-2);flex:1;white-space:nowrap;transition:background-color var(--t-small) var(--ease-out)}
.segctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--ring-hair)}

/* 진행 막대 */
.seg{display:flex;gap:var(--sp-1);flex:1}
.seg i{flex:1;height:8px;border-radius:var(--r-full);background:var(--surface-3)}
.seg i.done{background:var(--acc)}
.seg i.now{background:var(--acc);opacity:.45}

/* ===== 처음 시작 ===== */
.welcome{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-5);padding:var(--sp-10) var(--gutter)}
.welcome-form{display:flex;flex-direction:column;gap:var(--sp-3)}
.field{width:100%;min-height:var(--tap-lg);padding:0 var(--sp-4);border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--ring-strong);font-size:var(--fs-sub)}
.field:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.field-msg{min-height:20px;font-size:var(--fs-small);line-height:var(--lh-small);color:var(--bad);font-weight:var(--fw-bold)}
.field-msg:empty{min-height:0}

/* ===== 홈 ===== */
.hello{padding:var(--sp-2) 0 var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-1)}
.hello .seg{margin-top:var(--sp-2)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.tile{background:var(--surface);border-radius:var(--r-card);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2);min-width:0;text-align:left;transition:transform var(--t-press) var(--ease-out)}
button.tile:active{transform:scale(.98)}
.tile.span2{grid-column:span 2}
.bento > .tile:nth-child(2){animation-delay:60ms}
.bento > .tile:nth-child(3){animation-delay:120ms}
.bento > .tile:nth-child(4){animation-delay:180ms}
.today{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-top:var(--sp-1)}
.today .half{background:var(--surface-2);border-radius:var(--r-lg);padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-1);text-align:left;min-width:0;transition:transform var(--t-press) var(--ease-out)}
.today .half:active{transform:scale(.98)}
.today .half .mini{border-radius:var(--r-sm);overflow:hidden;margin-bottom:var(--sp-1);display:block}
.today .half .mini svg{display:block;width:100%;height:auto}
.today .half.done{background:var(--acc-soft)}
.pathdots{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.pathdots i{width:12px;height:12px;border-radius:var(--r-full);background:var(--surface-3)}
.pathdots i.d{background:var(--acc)} .pathdots i.n{background:var(--surface);box-shadow:inset 0 0 0 2px var(--acc)}
.tile .ic,.story .ic{width:40px;height:40px;border-radius:var(--r-md);background:var(--acc-soft);color:var(--acc-ink);display:grid;place-items:center}
.cont-row{display:flex;align-items:center;gap:var(--sp-3)}
.cont-row .btn.primary{min-height:var(--tap);padding:0 var(--sp-5)}
.cont-row .grow > *{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 길 ===== */
.unit{margin-top:var(--sp-6)}
.unit-h{display:flex;flex-direction:column;gap:var(--sp-1);margin-bottom:var(--sp-3)}
.steps-list{list-style:none;display:flex;flex-direction:column;gap:var(--sp-2);position:relative}
.stepbtn{width:100%;min-height:var(--tap-lg);display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);background:var(--surface);border-radius:var(--r-lg);text-align:left;transition:transform var(--t-press) var(--ease-out)}
.stepbtn:active{transform:scale(.98)}
.stepbtn .grow{display:flex;flex-direction:column}
.stepbtn[disabled]{background:var(--surface-2);color:var(--sub)}
.stepbtn[disabled] .t-body-b{color:var(--ink-2)}
.stepbtn.now{box-shadow:inset 0 0 0 2px var(--acc)}
.num-dot{width:32px;height:32px;border-radius:var(--r-full);display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);font-size:var(--fs-small);font-weight:var(--fw-bold);flex:none}
.stepbtn.done .num-dot{background:var(--acc);color:var(--on-acc)}
.stepbtn.now .num-dot{background:var(--acc-soft);color:var(--acc-ink)}
.stepbtn.mission .num-dot{background:var(--acc-soft);color:var(--acc-ink)}
.stars{display:flex;gap:var(--sp-1);color:var(--hair-strong)}
.stars svg.on{color:var(--acc-ink);fill:var(--acc)}

/* ===== 문제 화면 ===== */
.main.solo{max-width:none}
.qbar{height:var(--bar-h);display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--gutter) 0 var(--sp-1);flex:none;max-width:1180px;width:100%;margin:0 auto}
.qbar .grow{display:flex;flex-direction:column;line-height:1.3}
.status{display:flex;align-items:center;gap:var(--sp-1);margin-left:auto}
.hearts{display:flex;gap:var(--sp-1)}
.hearts i{width:12px;height:12px;border-radius:var(--r-full);background:var(--surface-3)}
.hearts i.on{background:var(--bad)}
.lesson-body{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto}
.prompt{padding:var(--sp-1) var(--gutter) var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-1)}
.prompt p{color:var(--ink-2)}
.card-step .prompt{gap:var(--sp-2);padding-top:var(--sp-4)}
.demo-cap{padding:var(--sp-2) var(--gutter) 0}
.boardwrap{padding:0 var(--gutter-board)}
/* 휴대폰: 판 아래 단추가 한 화면에 들어오게 판 크기를 세로 높이로도 묶는다 */
.play .boardwrap{width:min(100%, max(288px, calc(100dvh - 432px)));margin:0 auto}
.play.n9.sd .boardwrap{width:min(100%, max(288px, calc(100dvh - 472px)))}
.card-step .boardwrap{width:min(100%, 400px);margin:0 auto}
.boardframe{background:var(--surface);border-radius:var(--r-board);padding:var(--sp-2);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.board-svg{display:block;width:100%;height:auto;border-radius:var(--r-sm)}
.board-host{position:relative}
.cells{position:absolute;inset:0;display:grid}
.cellbtn{display:block;width:100%;height:100%;border-radius:6px;cursor:pointer}
.cellbtn:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.tip{font-size:var(--fs-small);color:var(--sub);text-align:center;padding:var(--sp-3) var(--gutter) 0}
.ruleline{display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-2) var(--gutter-board) 0;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);background:var(--bad-soft);color:var(--ink)}
.ruleline .ic{width:32px;height:32px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--bad);flex:none}
.ruleline b{color:var(--bad);font-weight:var(--fw-bold)}
.side-card{display:none}
.play{flex:1;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto}
.play-board{display:flex;flex-direction:column}
.play-side{display:flex;flex-direction:column;flex:1;justify-content:flex-end;padding-bottom:var(--sp-4)}
.tools{display:flex;justify-content:space-between;gap:var(--sp-1);padding:var(--sp-3) var(--sp-4) 0}
.tools button{flex:1;min-width:0;height:var(--tap-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-1);font-size:var(--fs-small);font-weight:var(--fw-bold);color:var(--ink-2);border-radius:var(--r-lg);transition:background-color var(--t-small) var(--ease-out)}
.tools button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc-ink)}
.tools button:active{background:var(--surface-2)}
.tools button:disabled{opacity:.38}
.keys{display:grid;gap:var(--sp-1);padding:var(--sp-3) var(--gutter-board) 0}
.keys.k4{grid-template-columns:repeat(4,1fr)}
.keys.k6{grid-template-columns:repeat(6,1fr)}
.keys.k5{grid-template-columns:repeat(5,1fr)}
.key{height:var(--tap-lg);border-radius:var(--r-btn);background:var(--surface);box-shadow:var(--ring-hair);font-size:var(--fs-head);font-weight:var(--fw-bold);display:grid;place-items:center;
  transition:transform var(--t-press) var(--ease-out),background-color var(--t-small) var(--ease-out)}
.key:active{transform:scale(.94);background:var(--acc-soft)}
.key.used{opacity:.38}
.key:disabled{opacity:.38}
.subtools{display:flex;justify-content:center;gap:var(--sp-4);padding-top:var(--sp-2)}
.options{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-2) var(--gutter)}
.options.row{flex-direction:row}
.options.row .option{flex:1}
.option{min-height:var(--tap-lg);padding:0 var(--sp-4);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--ring-hair);font-size:var(--fs-sub);font-weight:var(--fw-bold);text-align:left;transition:transform var(--t-press) var(--ease-out)}
.options.row .option{text-align:center}
.option:active{transform:scale(.98)}
.option.ok{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.option.bad{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.option:disabled{cursor:default}

/* 아래 고정 영역과 맞음/틀림 (면 + 캐릭터 + 문구 세 겹) */
.foot{flex:none;padding:var(--sp-3) var(--gutter) var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3)}
.foot .row{display:flex;gap:var(--sp-2)}
.foot .row .btn{flex:1}
.feedback{display:flex;gap:var(--sp-3);align-items:center;border-radius:var(--r-card);padding:var(--sp-3) var(--sp-4)}
.feedback.ok{background:var(--ok-soft)} .feedback.bad{background:var(--bad-soft)}
.feedback .face{width:48px;height:48px;flex:none}
.feedback .msg b{display:block;font-size:var(--fs-body);font-weight:var(--fw-bold)}
.feedback.ok .msg b{color:var(--ok)} .feedback.bad .msg b{color:var(--bad)}
.feedback .msg span{font-size:var(--fs-small);color:var(--ink-2);display:block}

/* 힌트 카드(3단계) */
.hintcard{margin:var(--sp-3) var(--sp-3) 0;background:var(--surface);border-radius:var(--r-card);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-1)}
.hintcard.coach{box-shadow:inset 0 0 0 2px var(--acc-soft)}
.hintcard .steps{display:flex;gap:var(--sp-1);margin-bottom:var(--sp-2)}
.hintcard .steps span{flex:1;display:flex;flex-direction:column;gap:var(--sp-1);font-size:var(--fs-small);font-weight:var(--fw-bold);color:var(--sub)}
.hintcard .steps span i{height:6px;border-radius:var(--r-full);background:var(--surface-3)}
.hintcard .steps span.on{color:var(--acc-ink)} .hintcard .steps span.on i{background:var(--acc)}
.hintcard .steps span.done i{background:var(--acc);opacity:.45}
.hintcard .acts{display:flex;gap:var(--sp-2);margin-top:var(--sp-3)} .hintcard .acts .btn{flex:1}
.hintcard .chip.tech{align-self:flex-start;margin-bottom:var(--sp-1)}
.hint-mark{display:flex;align-items:center;gap:var(--sp-1)}

/* 결과 */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--gutter);gap:var(--sp-4);max-width:560px;width:100%;margin:0 auto}
.result .t-display{color:var(--acc-ink)}
.result .summary{width:100%;text-align:left;display:flex;flex-direction:column;gap:var(--sp-1)}
.stars-big{display:flex;gap:var(--sp-2);color:var(--hair-strong)}
.star-big{width:48px;height:48px}
.star-big.on{color:var(--acc-ink);fill:var(--acc)}
.badge-big{display:flex;align-items:center;gap:var(--sp-2);height:48px;padding:0 var(--sp-5);border-radius:var(--r-full);background:var(--acc);color:var(--on-acc);font-weight:var(--fw-bold)}
.week{display:flex;gap:var(--sp-2);width:100%;background:var(--surface);border-radius:var(--r-card);padding:var(--sp-4)}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-1)}
.week i{width:32px;height:32px;border-radius:var(--r-full);background:var(--surface-2);display:grid;place-items:center}

<script>
(function () {
'use strict';
// ---- src/rng.mjs ----
// 씨앗(seed)이 같으면 같은 수열이 나오는 작은 난수기 (mulberry32).
// 오늘의 퍼즐은 날짜를 씨앗으로 써서 어느 기기에서나 같은 판이 나온다.
function makeRng(seed) {
  let a = seed >>> 0;
  return function rand() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffleWith(arr, rand) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

// 글자(날짜 "2026-11-14" 등) → 정수 씨앗 (FNV-1a). salt 로 같은 날 다른 퍼즐을 나눈다.
function seedFromText(text, salt = 0) {
  let h = (2166136261 ^ salt) >>> 0;
  for (const ch of String(text)) {
    h ^= ch.charCodeAt(0);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function combosOf(arr, k, start = 0, acc = [], res = []) {
  if (acc.length === k) { res.push(acc.slice()); return res; }
  for (let i = start; i < arr.length; i++) { acc.push(arr[i]); combosOf(arr, k, i + 1, acc, res); acc.pop(); }
  return res;
}

// 한국어 조사: 앞말의 받침에 따라 고른다. pair 는 '을를', '이가', '은는', '과와', '으로' 등.
const DIGIT_BATCHIM = { 0: true, 1: true, 2: false, 3: true, 4: false, 5: false, 6: true, 7: true, 8: true, 9: false };
function hasBatchim(word) {
  const s = String(word).trim();
  const ch = s[s.length - 1];
  if (ch === undefined) return false;
  if (/[0-9]/.test(ch)) return DIGIT_BATCHIM[ch];
  const code = ch.charCodeAt(0);
  if (code >= 0xac00 && code <= 0xd7a3) return (code - 0xac00) % 28 !== 0;
  return false;
}
function josa(word, pair) {
  const b = hasBatchim(word);
  if (pair === '으로') {
    const s = String(word).trim();
    const code = s.charCodeAt(s.length - 1);
    const rieul = code >= 0xac00 && code <= 0xd7a3 && (code - 0xac00) % 28 === 8;
    return word + (b && !rieul ? '으로' : '로');
  }

}

// ---- src/sudoku.mjs ----
// 스도쿠 엔진: 판 모양, 규칙 검사, 해 세기, 사람 기법 풀이기, 난이도, 생성기. 화면과 무관한 순수 함수.
// 판은 길이 n*n 배열(0 = 빈칸, 1..n = 숫자). 글자로는 '.'(빈칸)과 숫자.

const SD_SIZES = [4, 6, 9];

// 기법 목록(쉬운 것부터). 풀이기는 이 순서로 시도하고, 쓴 기법 중 가장 어려운 것이 난이도다.
const SD_TECH = [
  { id: 'full-house', name: '마지막 빈칸', en: 'Full house' },
  { id: 'hidden-single-box', name: '숨은 한 자리', en: 'Hidden single (box)' },
  { id: 'hidden-single-line', name: '숨은 한 자리', en: 'Hidden single (row/column)' },
  { id: 'naked-single', name: '하나뿐인 숫자', en: 'Naked single' },
  { id: 'pointing', name: '가리키기', en: 'Pointing' },
  { id: 'claiming', name: '차지하기', en: 'Claiming' },
  { id: 'naked-pair', name: '드러난 짝', en: 'Naked pair' },
  { id: 'hidden-pair', name: '숨은 짝', en: 'Hidden pair' },
  { id: 'naked-triple', name: '셋 묶음', en: 'Naked triple' },
  { id: 'hidden-triple', name: '숨은 셋 묶음', en: 'Hidden triple' },
  { id: 'x-wing', name: 'X-윙', en: 'X-Wing' },
];
const SD_TECH_INDEX = Object.fromEntries(SD_TECH.map((t, i) => [t.id, i]));
const sdTechIndex = (id) => {
  if (!(id in SD_TECH_INDEX)) throw new Error('모르는 스도쿠 기법: ' + id);
  return SD_TECH_INDEX[id];
};

const SD_SHAPES = {};
function sdShape(n) {
  if (SD_SHAPES[n]) return SD_SHAPES[n];
  const dims = n === 4 ? [2, 2] : n === 6 ? [2, 3] : n === 9 ? [3, 3] : null;
  if (!dims) throw new Error('스도쿠 판 크기는 4, 6, 9: ' + n);
  const [br, bc] = dims;
  const units = [];
  for (let r = 0; r < n; r++) units.push({ kind: 'row', i: r, cells: [...Array(n)].map((_, c) => r * n + c) });
  for (let c = 0; c < n; c++) units.push({ kind: 'col', i: c, cells: [...Array(n)].map((_, r) => r * n + c) });
  for (let b = 0; b < n; b++) {
    const r0 = Math.floor(b / (n / bc)) * br;
    const c0 = (b % (n / bc)) * bc;
    const cells = [];
    for (let r = 0; r < br; r++) for (let c = 0; c < bc; c++) cells.push((r0 + r) * n + c0 + c);
    units.push({ kind: 'box', i: b, cells });
  }
  const boxOf = new Array(n * n);
  units.filter((u) => u.kind === 'box').forEach((u) => u.cells.forEach((x) => (boxOf[x] = u.i)));
  const peerSets = [...Array(n * n)].map(() => new Set());
  for (const u of units) for (const a of u.cells) for (const b of u.cells) if (a !== b) peerSets[a].add(b);
  const shape = {
    n, br, bc, units, boxOf, all: (1 << n) - 1,
    peers: peerSets.map((s) => [...s].sort((a, b) => a - b)),
    rows: units.filter((u) => u.kind === 'row'),
    cols: units.filter((u) => u.kind === 'col'),
    boxes: units.filter((u) => u.kind === 'box'),
  };
  SD_SHAPES[n] = shape;
  return shape;
}

function sdParse(text) {
  const s = Array.isArray(text) ? text.join('') : String(text);
  const cells = [...s.replace(/\s+/g, '')].map((ch) => (ch === '.' || ch === '0' ? 0 : Number(ch)));
  const n = Math.round(Math.sqrt(cells.length));
  if (n * n !== cells.length || !SD_SIZES.includes(n) || cells.some((v) => !Number.isInteger(v) || v < 0 || v > n)) throw new Error('스도쿠 판 글자가 잘못됨: ' + s);
  return cells;
}
const sdFormat = (grid) => grid.map((v) => (v ? String(v) : '.')).join('');
const sdSizeOf = (grid) => Math.round(Math.sqrt(grid.length));

const sdPopcount = (m) => { let k = 0; while (m) { m &= m - 1; k++; } return k; };
const sdBitDigit = (m) => 32 - Math.clz32(m);
const sdDigitsOf = (m) => { const out = []; for (let d = 1; m >> (d - 1); d++) if (m & (1 << (d - 1))) out.push(d); return out; };

// 규칙 검사: 같은 줄·상자에 같은 숫자가 겹친 칸들
function sdConflicts(grid) {
  const shape = sdShape(sdSizeOf(grid));
  const bad = new Set();
  for (const u of shape.units) {
    const seen = new Map();
    for (const x of u.cells) if (grid[x]) {
      if (seen.has(grid[x])) { bad.add(x); bad.add(seen.get(grid[x])); } else seen.set(grid[x], x);
    }
  }
  return [...bad].sort((a, b) => a - b);
}
const sdIsSolved = (grid) => grid.every(Boolean) && sdConflicts(grid).length === 0;

// 해 세기: limit 개에서 멈춘다. rand 를 주면 숫자 순서를 섞는다(무작위 완성판). out 에 첫 해를 담는다.
function sdCount(grid, limit = 2, rand = null, out = null) {
  const n = sdSizeOf(grid);
  const { boxOf, all } = sdShape(n);
  const rowM = new Array(n).fill(0), colM = new Array(n).fill(0), boxM = new Array(n).fill(0);
  const g = grid.slice();
  for (let x = 0; x < n * n; x++) if (g[x]) {
    const b = 1 << (g[x] - 1), r = Math.floor(x / n), c = x % n;
    if ((rowM[r] | colM[c] | boxM[boxOf[x]]) & b) return 0;
    rowM[r] |= b; colM[c] |= b; boxM[boxOf[x]] |= b;
  }
  let count = 0;
  function rec() {
    let best = -1, bestMask = 0, bestK = 99;
    for (let x = 0; x < n * n; x++) if (!g[x]) {
      const m = all & ~(rowM[Math.floor(x / n)] | colM[x % n] | boxM[boxOf[x]]);
      const k = sdPopcount(m);
      if (k < bestK) { bestK = k; best = x; bestMask = m; if (k <= 1) break; }
    }
    if (best < 0) { count++; if (out && !out.length) out.push(g.slice()); return count >= limit; }
    if (bestK === 0) return false;
    const digits = sdDigitsOf(bestMask);
    if (rand) shuffleWith(digits, rand);
    const r = Math.floor(best / n), c = best % n, bx = boxOf[best];
    for (const d of digits) {
      const b = 1 << (d - 1);
      g[best] = d; rowM[r] |= b; colM[c] |= b; boxM[bx] |= b;
      if (rec()) return true;
      g[best] = 0; rowM[r] &= ~b; colM[c] &= ~b; boxM[bx] &= ~b;
    }
    return false;
  }
  rec();
  return count;
}

function sdSolution(grid) {
  const out = [];
  return sdCount(grid, 2, null, out) === 1 ? out[0] : null;
}

// ── 사람 기법 풀이기 ──
// 상태: val(놓인 숫자), cand(칸마다 후보 비트). notes 를 주면 사용자의 메모를 후보로 쓴다(빈 메모 칸은 전체 후보).
function sdState(grid, notes = null) {
  const n = sdSizeOf(grid);
  const shape = sdShape(n);
  const st = { n, shape, val: grid.slice(), cand: new Array(n * n).fill(shape.all) };
  for (let x = 0; x < n * n; x++) if (st.val[x]) st.cand[x] = 0;
  for (let x = 0; x < n * n; x++) if (st.val[x]) for (const p of shape.peers[x]) st.cand[p] &= ~(1 << (st.val[x] - 1));
  if (notes) for (let x = 0; x < n * n; x++) if (!st.val[x] && notes[x]) st.cand[x] &= notes[x];
  return st;
}
const sdCloneState = (st) => ({ ...st, val: st.val.slice(), cand: st.cand.slice() });

function sdApply(st, step) {
  for (const { x, d } of step.place || []) {
    st.val[x] = d; st.cand[x] = 0;
    for (const p of st.shape.peers[x]) st.cand[p] &= ~(1 << (d - 1));
  }
  for (const { x, mask } of step.elim || []) st.cand[x] &= ~mask;
  return st;
}

const sdEmpties = (st, u) => u.cells.filter((x) => !st.val[x]);
const sdUnitHas = (st, u, d) => u.cells.some((x) => st.val[x] === d);

// 각 기법은 상태를 바꾸지 않고 찾은 단계(또는 null)를 돌려준다. all=true 면 찾은 단계를 모두 돌려준다.
const SD_FINDERS = {
  'full-house'(st, all) {
    const res = [];
    for (const u of st.shape.units) {
      const e = sdEmpties(st, u);
      if (e.length !== 1) continue;
      let missing = 0;
      for (let d = 1; d <= st.n; d++) if (!sdUnitHas(st, u, d)) missing = d;
      if (!missing || !(st.cand[e[0]] & (1 << (missing - 1)))) continue;
      res.push({ tech: 'full-house', unit: u, focus: [u], place: [{ x: e[0], d: missing }], cells: [e[0]], digit: missing });
      if (!all) return res;
    }
    return res;
  },
  'hidden-single-box'(st, all) { return sdHidden(st, st.shape.boxes, 'hidden-single-box', all); },
  'hidden-single-line'(st, all) { return sdHidden(st, [...st.shape.rows, ...st.shape.cols], 'hidden-single-line', all); },
  'naked-single'(st, all) {
    const res = [];
    for (let x = 0; x < st.n * st.n; x++) if (!st.val[x] && sdPopcount(st.cand[x]) === 1) {
      const d = sdBitDigit(st.cand[x]);
      res.push({ tech: 'naked-single', cell: x, focus: [], place: [{ x, d }], cells: [x], digit: d });
      if (!all) return res;
    }
    return res;
  },
  pointing(st, all) { return sdLocked(st, true, all); },
  claiming(st, all) { return sdLocked(st, false, all); },
  'naked-pair'(st, all) { return sdNaked(st, 2, 'naked-pair', all); },
  'hidden-pair'(st, all) { return sdHiddenSubset(st, 2, 'hidden-pair', all); },
  'naked-triple'(st, all) { return sdNaked(st, 3, 'naked-triple', all); },
  'hidden-triple'(st, all) { return sdHiddenSubset(st, 3, 'hidden-triple', all); },
  'x-wing'(st, all) {
    const res = [];
    const { n, shape } = st;
    for (const [lines, cross, kind] of [[shape.rows, shape.cols, 'row'], [shape.cols, shape.rows, 'col']]) {
      for (let d = 1; d <= n; d++) {
        const b = 1 << (d - 1);
        const pos = lines.map((u) => u.cells.map((x, j) => (st.cand[x] & b ? j : -1)).filter((j) => j >= 0));
        for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
          if (pos[i].length !== 2 || pos[j].length !== 2 || pos[i][0] !== pos[j][0] || pos[i][1] !== pos[j][1]) continue;
          const corners = [lines[i].cells[pos[i][0]], lines[i].cells[pos[i][1]], lines[j].cells[pos[j][0]], lines[j].cells[pos[j][1]]];
          const elim = [];
          for (const cj of pos[i]) for (const x of cross[cj].cells) if (!corners.includes(x) && (st.cand[x] & b)) elim.push({ x, mask: b });
          if (!elim.length) continue;
          res.push({ tech: 'x-wing', kind, lines: [lines[i], lines[j]], cross: [cross[pos[i][0]], cross[pos[i][1]]], focus: [lines[i], lines[j]], cells: corners, digit: d, elim });
          if (!all) return res;
        }
      }
    }
    return res;
  },
};

function sdHidden(st, units, tech, all) {
  const res = [];
  for (const u of units) for (let d = 1; d <= st.n; d++) {
    if (sdUnitHas(st, u, d)) continue;
    const b = 1 << (d - 1);
    const where = u.cells.filter((x) => st.cand[x] & b);
    if (where.length !== 1) continue;
    if (sdEmpties(st, u).length === 1) continue; // 마지막 빈칸이 먼저
    res.push({ tech, unit: u, focus: [u], place: [{ x: where[0], d }], cells: [where[0]], digit: d });
    if (!all) return res;
  }
  return res;
}

function sdLocked(st, pointing, all) {
  const res = [];
  const { shape, n } = st;
  for (const bx of shape.boxes) for (const ln of [...shape.rows, ...shape.cols]) {
    const inter = bx.cells.filter((x) => ln.cells.includes(x));
    if (inter.length < 2) continue;
    for (let d = 1; d <= n; d++) {
      const b = 1 << (d - 1);
      const inBox = bx.cells.filter((x) => st.cand[x] & b);
      const inLine = ln.cells.filter((x) => st.cand[x] & b);
      const [from, to, src] = pointing ? [inBox, inLine, bx] : [inLine, inBox, ln];
      if (from.length < 2 || !from.every((x) => inter.includes(x))) continue;
      const elim = to.filter((x) => !inter.includes(x)).map((x) => ({ x, mask: b }));
      if (!elim.length) continue;
      res.push({ tech: pointing ? 'pointing' : 'claiming', box: bx, line: ln, unit: src, focus: [bx, ln], cells: from, digit: d, elim });
      if (!all) return res;
    }
  }
  return res;
}

function sdNaked(st, k, tech, all) {
  const res = [];
  for (const u of st.shape.units) {
    const e = sdEmpties(st, u);
    const small = e.filter((x) => { const c = sdPopcount(st.cand[x]); return c >= 2 && c <= k; });
    for (const cs of combosOf(small, k)) {
      const m = cs.reduce((a, x) => a | st.cand[x], 0);
      if (sdPopcount(m) !== k) continue;
      const elim = [];
      for (const x of e) if (!cs.includes(x) && (st.cand[x] & m)) elim.push({ x, mask: st.cand[x] & m });
      if (!elim.length) continue;
      res.push({ tech, unit: u, focus: [u], cells: cs, digits: sdDigitsOf(m), elim });
      if (!all) return res;
    }
  }
  return res;
}

function sdHiddenSubset(st, k, tech, all) {
  const res = [];
  for (const u of st.shape.units) {
    const e = sdEmpties(st, u);
    const digits = [];
    for (let d = 1; d <= st.n; d++) if (!sdUnitHas(st, u, d)) digits.push(d);
    for (const ds of combosOf(digits, k)) {
      const m = ds.reduce((a, d) => a | (1 << (d - 1)), 0);
      const where = e.filter((x) => st.cand[x] & m);
      if (where.length !== k) continue;
      if (!ds.every((d) => where.some((x) => st.cand[x] & (1 << (d - 1))))) continue;
      const elim = [];
      for (const x of where) if (st.cand[x] & ~m) elim.push({ x, mask: st.cand[x] & ~m });
      if (!elim.length) continue;
      res.push({ tech, unit: u, focus: [u], cells: where, digits: ds, elim });
      if (!all) return res;
    }
  }
  return res;
}

// 지금 상태에서 쓸 수 있는 가장 쉬운 단계. maxTech(번호) 까지만 본다.
function sdNextStep(st, maxTech = SD_TECH.length - 1) {
  for (let t = 0; t <= maxTech; t++) {
    const found = SD_FINDERS[SD_TECH[t].id](st, false);
    if (found.length) return found[0];
  }
  return null;
}
// 특정 기법으로 찾을 수 있는 단계 모두 (차시 문제 고르기용)
function sdFindAll(st, techId) {
  if (!SD_FINDERS[techId]) throw new Error('모르는 스도쿠 기법: ' + techId);
  return SD_FINDERS[techId](st, true);
}

// 후보가 하나도 없는 빈칸이 있으면 모순(사용자 메모가 틀렸을 때 등)
const sdStuck = (st) => st.val.some((v, x) => !v && !st.cand[x]);

// 끝까지 풀어 본다. 기록(steps)과 가장 어려운 기법 번호(hardest)
function sdGrade(grid, { maxTech = SD_TECH.length - 1, keepSteps = false, notes = null } = {}) {
  const st = sdState(grid, notes);
  let hardest = -1;
  const counts = new Array(SD_TECH.length).fill(0);
  const steps = [];
  while (st.val.some((v) => !v)) {
    if (sdStuck(st)) return { solved: false, hardest: SD_TECH.length, counts, steps, state: st };
    const step = sdNextStep(st, maxTech);
    if (!step) return { solved: false, hardest: SD_TECH.length, counts, steps, state: st };
    const t = SD_TECH_INDEX[step.tech];
    counts[t]++;
    if (t > hardest) hardest = t;
    if (keepSteps) steps.push(step);
    sdApply(st, step);
  }
  return { solved: true, hardest, counts, steps, state: st, stepCount: counts.reduce((a, b) => a + b, 0) };
}

// 난이도 이름: 기법 번호 → 쉬움·보통·어려움
// 쉬움: 하나뿐인 숫자까지 / 보통: 가리키기·차지하기 / 어려움: 짝·셋 묶음·X-윙
function sdLevelOf(hardest) {
  if (hardest <= SD_TECH_INDEX['naked-single']) return 'easy';
  if (hardest <= SD_TECH_INDEX['claiming']) return 'normal';
  return 'hard';
}

// ── 생성기 ──
// 무작위 완성판 → 칸을 무작위 순서로 지우며 "해가 하나 + maxTech 까지만으로 풀림"을 확인.
function sdGenerateOnce(n, rand, maxTech, minGivens, logic = true) {
  const out = [];
  sdCount(new Array(n * n).fill(0), 1, rand, out);
  const solution = out[0];
  const puzzle = solution.slice();
  const order = shuffleWith([...Array(n * n).keys()], rand);
  let givens = n * n;
  for (const x of order) {
    if (givens <= minGivens) break;
    const keep = puzzle[x];
    puzzle[x] = 0;
    const ok = sdCount(puzzle, 2) === 1 && (!logic || sdGrade(puzzle, { maxTech }).solved);
    if (ok) givens--; else puzzle[x] = keep;
  }
  return { puzzle, solution, grade: sdGrade(puzzle) };
}

// opts: maxTech(id), minTech(id, 이 기법 이상이 꼭 필요), minGivens, attempts(최대 시도)
// 같은 씨앗이면 같은 판. minTech 를 못 맞추면 가장 어려운 판을 돌려주고 met=false.
function sdGenerate(n, seed, opts = {}) {
  const rand = typeof seed === 'function' ? seed : makeRng(seed);
  const maxTech = opts.maxTech ? sdTechIndex(opts.maxTech) : SD_TECH.length - 1;
  const minTech = opts.minTech ? sdTechIndex(opts.minTech) : -1;
  const attempts = opts.attempts ?? 40;
  let best = null;
  for (let i = 0; i < attempts; i++) {
    const r = sdGenerateOnce(n, rand, maxTech, opts.minGivens || 0, opts.logic !== false);
    r.attempt = i;
    if (!r.grade.solved || r.grade.hardest > maxTech) continue;
    if (r.grade.hardest >= minTech) return { ...r, met: true };
    if (!best || r.grade.hardest > best.grade.hardest) best = r;
  }
  return best ? { ...best, met: false } : null;
}

// ── 같은 판 찾기: 돌리기·뒤집기·숫자 바꾸기로 같아지는 판을 하나의 글자로 ──
function sdCanonical(grid) {
  const n = sdSizeOf(grid);
  const sq = n !== 6; // 6×6 은 상자가 2×3 이라 돌리면 상자 모양이 바뀐다
  const maps = [];
  const at = (r, c) => r * n + c;
  const tf = [
    (r, c) => at(r, c), (r, c) => at(r, n - 1 - c), (r, c) => at(n - 1 - r, c), (r, c) => at(n - 1 - r, n - 1 - c),
  ];
  if (sq) tf.push((r, c) => at(c, r), (r, c) => at(c, n - 1 - r), (r, c) => at(n - 1 - c, r), (r, c) => at(n - 1 - c, n - 1 - r));
  for (const f of tf) {
    const g = new Array(n * n);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) g[at(r, c)] = grid[f(r, c)];
    const relabel = new Map();
    maps.push(g.map((v) => { if (!v) return '.'; if (!relabel.has(v)) relabel.set(v, relabel.size + 1); return String(relabel.get(v)); }).join(''));
  }
  return maps.sort()[0];
}

// ── 이름과 문장 ──
function sdCellName(n, x) { return `${Math.floor(x / n) + 1}줄 ${(x % n) + 1}칸`; }
function sdUnitName(u) {
  return u.kind === 'row' ? `${u.i + 1}번째 가로줄` : u.kind === 'col' ? `${u.i + 1}번째 세로줄` : `${u.i + 1}번 상자`;
}
const sdList = (arr) => arr.join(', ');

// 힌트 문장: where(어디를 볼까), why(기법 이름과 이유), todo(이렇게 해요)
// opts.memo: 이 단계가 메모(후보 표시)를 근거로 찾은 것이면 "메모를 보면"으로 말한다(주변 숫자만으로는 성립하지 않을 수 있어서).
function sdStepText(n, step, opts = {}) {
  const t = sdStepTextBase(n, step);
  if (!opts.memo) return t;
  const C = (x) => sdCellName(n, x);
  const d = step.digit;
  if (step.tech === 'hidden-single-box' || step.tech === 'hidden-single-line') return { ...t, why: `메모를 보면 ${sdUnitName(step.unit)}에서 ${josa(String(d), '이가')} 들어갈 수 있는 칸은 ${C(step.cells[0])} 하나뿐이에요.` };
  if (step.tech === 'naked-single') return { ...t, why: `메모를 보면 ${C(step.cell)}에 남은 숫자가 ${d} 하나뿐이에요.` };
  if (step.tech === 'full-house') return t;
  return { ...t, why: '메모를 보면, ' + t.why };
}
function sdStepTextBase(n, step) {
  const C = (x) => sdCellName(n, x);
  const U = sdUnitName;
  const d = step.digit;
  const name = SD_TECH[SD_TECH_INDEX[step.tech]].name;
  switch (step.tech) {
    case 'full-house': {
      const u = U(step.unit);
      return { name, where: `${josa(u, '을를')} 보세요.`, why: `${u}에 빈칸이 하나만 남았어요. 빠진 숫자는 ${d}뿐이에요.`, todo: `${C(step.cells[0])}에 ${josa(String(d), '을를')} 놓아요.` };
    }
    case 'hidden-single-box':
    case 'hidden-single-line': {
      const u = U(step.unit);
      return { name, where: `${u}에서 ${josa(String(d), '이가')} 들어갈 곳을 찾아보세요.`, why: `${u}에서 ${josa(String(d), '이가')} 들어갈 수 있는 칸은 ${C(step.cells[0])} 하나뿐이에요. 다른 칸은 같은 줄이나 상자에 이미 ${josa(String(d), '이가')} 있어요.`, todo: `${C(step.cells[0])}에 ${josa(String(d), '을를')} 놓아요.` };
    }
    case 'naked-single': {
      const c = C(step.cell);
      return { name, where: `${josa(c, '을를')} 보세요.`, why: `${c}의 가로줄, 세로줄, 상자를 보면 들어갈 수 있는 숫자가 ${d} 하나뿐이에요.`, todo: `${c}에 ${josa(String(d), '을를')} 놓아요.` };
    }
    case 'pointing': {
      const b = U(step.box), l = U(step.line);
      return { name, where: `${b}의 ${josa(String(d), '을를')} 보세요.`, why: `${b}에서 ${josa(String(d), '이가')} 들어갈 수 있는 칸이 모두 ${l}에 있어요. 그래서 ${l}의 상자 밖 칸에서는 ${josa(String(d), '을를')} 지워요.`, todo: `${sdList(step.elim.map((e) => C(e.x)))}에서 ${josa(String(d), '을를')} 지워요.` };
    }
    case 'claiming': {
      const b = U(step.box), l = U(step.line);
      return { name, where: `${l}의 ${josa(String(d), '을를')} 보세요.`, why: `${l}에서 ${josa(String(d), '이가')} 들어갈 수 있는 칸이 모두 ${b} 안에 있어요. 그래서 ${b}의 다른 칸에서는 ${josa(String(d), '을를')} 지워요.`, todo: `${sdList(step.elim.map((e) => C(e.x)))}에서 ${josa(String(d), '을를')} 지워요.` };
    }
    case 'naked-pair':
    case 'naked-triple': {
      const u = U(step.unit), ds = sdList(step.digits), cs = sdList(step.cells.map(C));
      const k = step.cells.length === 2 ? '두' : '세';
      return { name, where: `${u}의 ${josa(cs, '을를')} 보세요.`, why: `${cs}에는 ${ds}만 들어갈 수 있어요. ${k} 칸이 이 숫자들을 나눠 가지니, ${u}의 다른 칸에서는 ${josa(ds, '을를')} 지워요.`, todo: `${sdList(step.elim.map((e) => C(e.x)))}에서 ${josa(ds, '을를')} 지워요.` };
    }
    case 'hidden-pair':
    case 'hidden-triple': {
      const u = U(step.unit), ds = sdList(step.digits), cs = sdList(step.cells.map(C));
      const k = step.cells.length === 2 ? '두' : '세';
      return { name, where: `${u}에서 ${josa(ds, '이가')} 들어갈 곳을 보세요.`, why: `${u}에서 ${josa(ds, '이가')} 들어갈 수 있는 칸은 ${cs} ${k} 칸뿐이에요. 그래서 이 칸들의 다른 후보는 지워요.`, todo: `${cs}에 ${ds}만 남겨요.` };
    }
    case 'x-wing': {
      const [a, b] = step.lines.map(U), [p, q] = step.cross.map(U);
      const crossKind = step.kind === 'row' ? '세로줄' : '가로줄';
      return { name, where: `${josa(a, '과와')} ${b}의 ${josa(String(d), '을를')} 보세요.`, why: `${josa(a, '과와')} ${b}에서 ${josa(String(d), '이가')} 들어갈 칸이 똑같이 ${josa(p, '과와')} ${q}에만 있어요. 네모 꼭짓점 네 칸 중 마주 보는 두 칸에 ${josa(String(d), '이가')} 들어가니, 두 ${crossKind}의 다른 칸에서는 ${josa(String(d), '을를')} 지워요.`, todo: `${sdList(step.elim.map((e) => C(e.x)))}에서 ${josa(String(d), '을를')} 지워요.` };
    }
    default:
      throw new Error('문장 틀이 없는 기법: ' + step.tech);
  }
}

// ---- src/cats.mjs ----
// 고양이 자리 엔진 (장르: 스타 배틀 1개형). N×N 판, N개 색 구역.
// 규칙: 가로줄·세로줄·구역마다 고양이 정확히 1마리, 고양이끼리 8방향(대각선 포함)으로 닿지 않는다.
// 판은 region 배열(길이 n*n, 0..n-1). 글자로는 'A'..'J'. 해는 칸 번호 배열(가로줄마다 하나, cols[r] 대신 칸 번호로 다룸).

const CT_LETTERS = 'ABCDEFGHIJ';
const CT_TECH = [
  { id: 'last-spot', name: '마지막 자리', en: 'Last cell' },
  { id: 'one-line', name: '한 줄에 갇힌 구역', en: 'Region confined to a line' },
  { id: 'blocks-all', name: '모두가 닿는 칸', en: 'Nosy neighbors' },
  { id: 'k-lines', name: '묶어서 보기', en: 'N regions in N lines' },
  { id: 'what-if', name: '가정해 보기', en: 'Contradiction' },
];
const CT_TECH_INDEX = Object.fromEntries(CT_TECH.map((t, i) => [t.id, i]));
const ctTechIndex = (id) => {
  if (!(id in CT_TECH_INDEX)) throw new Error('모르는 고양이 자리 기법: ' + id);
  return CT_TECH_INDEX[id];
};

const ctNear = (n, a, b) => Math.abs(Math.floor(a / n) - Math.floor(b / n)) <= 1 && Math.abs((a % n) - (b % n)) <= 1;

function ctParse(text) {
  const rows = Array.isArray(text) ? text : String(text).trim().split(/\s+/);
  let s = rows.join('');
  const n = Math.round(Math.sqrt(s.length));
  if (n * n !== s.length || n < 4 || n > 10) throw new Error('고양이 자리 판 글자가 잘못됨: ' + s);
  const region = [...s].map((ch) => CT_LETTERS.indexOf(ch.toUpperCase()));
  const cats = [...s].map((ch, x) => (ch !== ch.toUpperCase() ? x : -1)).filter((x) => x >= 0);
  if (region.some((g) => g < 0 || g >= n)) throw new Error('구역 글자가 잘못됨: ' + s);
  for (let g = 0; g < n; g++) if (!region.includes(g)) throw new Error('빈 구역: ' + CT_LETTERS[g]);
  return { n, region, cats };
}
const ctFormat = (region) => region.map((g) => CT_LETTERS[g]).join('');
const ctSizeOf = (region) => Math.round(Math.sqrt(region.length));

// 구역이 한 덩어리(위아래·양옆으로 이어짐)인지
function ctRegionsConnected(n, region) {
  for (let g = 0; g < n; g++) {
    const cells = region.map((v, x) => (v === g ? x : -1)).filter((x) => x >= 0);
    if (!cells.length) return false;
    const seen = new Set([cells[0]]);
    const stack = [cells[0]];
    while (stack.length) {
      const x = stack.pop();
      const r = Math.floor(x / n), c = x % n;
      for (const [y, ok] of [[x - n, r > 0], [x + n, r < n - 1], [x - 1, c > 0], [x + 1, c < n - 1]]) if (ok && region[y] === g && !seen.has(y)) { seen.add(y); stack.push(y); }
    }
    if (seen.size !== cells.length) return false;
  }
  return true;
}

// 규칙 검사: 놓인 고양이(칸 번호 배열) 중 규칙을 어긴 것들과 이유
function ctConflicts(n, region, cats) {
  const bad = new Set();
  const reasons = [];
  for (let i = 0; i < cats.length; i++) for (let j = i + 1; j < cats.length; j++) {
    const a = cats[i], b = cats[j];
    let why = null;
    if (Math.floor(a / n) === Math.floor(b / n)) why = 'row';
    else if (a % n === b % n) why = 'col';
    else if (region[a] === region[b]) why = 'region';
    else if (ctNear(n, a, b)) why = 'touch';
    if (why) { bad.add(a); bad.add(b); reasons.push({ a, b, why }); }
  }
  return { cells: [...bad].sort((x, y) => x - y), reasons };
}
function ctIsSolved(n, region, cats) {
  if (cats.length !== n || ctConflicts(n, region, cats).cells.length) return false;
  return true;
}

// 해 세기: limit 개에서 멈춘다. region[x] < 0 인 칸(아직 구역 없음)에는 놓을 수 없다. out 에 첫 해(칸 번호 배열).
function ctCount(n, region, limit = 2, out = null) {
  const usedCol = new Array(n).fill(false), usedReg = new Array(n).fill(false);
  const cols = [];
  let count = 0;
  function rec(r) {
    if (r === n) { count++; if (out && !out.length) out.push(cols.map((c, i) => i * n + c)); return count >= limit; }
    const prev = r ? cols[r - 1] : -9;
    for (let c = 0; c < n; c++) {
      if (usedCol[c] || Math.abs(c - prev) <= 1) continue;
      const g = region[r * n + c];
      if (g < 0 || usedReg[g]) continue;
      usedCol[c] = usedReg[g] = true; cols.push(c);
      if (rec(r + 1)) return true;
      usedCol[c] = usedReg[g] = false; cols.pop();
    }
    return false;
  }
  rec(0);
  return count;
}
function ctSolution(n, region) {
  const out = [];
  return ctCount(n, region, 2, out) === 1 ? out[0] : null;
}

// ── 사람 기법 풀이기 ──
function ctUnits(n, region) {
  const units = [];
  for (let r = 0; r < n; r++) units.push({ kind: 'row', i: r, cells: [...Array(n)].map((_, c) => r * n + c) });
  for (let c = 0; c < n; c++) units.push({ kind: 'col', i: c, cells: [...Array(n)].map((_, r) => r * n + c) });
  for (let g = 0; g < n; g++) units.push({ kind: 'reg', i: g, cells: region.map((v, x) => (v === g ? x : -1)).filter((x) => x >= 0) });
  return units;
}

// cats: 놓인 고양이 칸, marks: 사용자가 × 한 칸(비워 둘 칸)
function ctState(n, region, cats = [], marks = []) {
  const s = { n, region, units: ctUnits(n, region), cand: new Array(n * n).fill(true), cat: new Array(n * n).fill(false) };
  for (const x of cats) ctPlace(s, x);
  for (const x of marks) if (!s.cat[x]) s.cand[x] = false;
  return s;
}
const ctClone = (s) => ({ ...s, cand: s.cand.slice(), cat: s.cat.slice() });

function ctPlace(s, x) {
  const { n } = s;
  s.cat[x] = true; s.cand[x] = false;
  for (let y = 0; y < n * n; y++) {
    if (y === x) continue;
    if (Math.floor(y / n) === Math.floor(x / n) || y % n === x % n || s.region[y] === s.region[x] || ctNear(n, x, y)) s.cand[y] = false;
  }
}
// 고양이 하나를 두면 비워 둘 칸들(지우기 표시 차시용)
function ctBlockedBy(n, region, x) {
  const out = [];
  for (let y = 0; y < n * n; y++) if (y !== x && (Math.floor(y / n) === Math.floor(x / n) || y % n === x % n || region[y] === region[x] || ctNear(n, x, y))) out.push(y);
  return out;
}

function ctApply(s, step) {
  for (const x of step.place || []) ctPlace(s, x);
  for (const x of step.elim || []) s.cand[x] = false;
  return s;
}

const ctHasCat = (s, u) => u.cells.some((x) => s.cat[x]);
const ctCands = (s, u) => u.cells.filter((x) => s.cand[x]);
const ctEmptyUnit = (s) => s.units.find((u) => !ctHasCat(s, u) && ctCands(s, u).length === 0) || null;
const ctDone = (s) => s.units.every((u) => ctHasCat(s, u));
const ctRow = (s, i) => s.units[i];
const ctCol = (s, i) => s.units[s.n + i];
const ctReg = (s, g) => s.units[2 * s.n + g];

const CT_FINDERS = {
  'last-spot'(s, all) {
    const res = [];
    for (const u of s.units) {
      if (ctHasCat(s, u)) continue;
      const c = ctCands(s, u);
      if (c.length !== 1) continue;
      res.push({ tech: 'last-spot', unit: u, focus: [u], place: [c[0]], cells: [c[0]] });
      if (!all) return res;
    }
    return res;
  },
  'one-line'(s, all) {
    const res = [];
    const { n } = s;
    for (const u of s.units) {
      if (ctHasCat(s, u)) continue;
      const c = ctCands(s, u);
      if (!c.length) continue;
      if (u.kind === 'reg') {
        for (const [kind, key] of [['row', (x) => Math.floor(x / n)], ['col', (x) => x % n]]) {
          const k0 = key(c[0]);
          if (!c.every((x) => key(x) === k0)) continue;
          const line = kind === 'row' ? ctRow(s, k0) : ctCol(s, k0);
          const elim = ctCands(s, line).filter((x) => s.region[x] !== u.i);
          if (!elim.length) continue;
          res.push({ tech: 'one-line', variant: 'reg-in-line', reg: u, line, focus: [u, line], cells: c, elim });
          if (!all) return res;
        }
      } else {
        const g0 = s.region[c[0]];
        if (!c.every((x) => s.region[x] === g0)) continue;
        const reg = ctReg(s, g0);
        const elim = ctCands(s, reg).filter((x) => !u.cells.includes(x));
        if (!elim.length) continue;
        res.push({ tech: 'one-line', variant: 'line-in-reg', reg, line: u, focus: [u, reg], cells: c, elim });
        if (!all) return res;
      }
    }
    return res;
  },
  'blocks-all'(s, all) {
    const res = [];
    for (let x = 0; x < s.n * s.n; x++) {
      if (!s.cand[x]) continue;
      const t = ctClone(s);
      ctPlace(t, x);
      const u = ctEmptyUnit(t);
      if (!u) continue;
      res.push({ tech: 'blocks-all', cell: x, unit: u, focus: [u], cells: ctCands(s, u), elim: [x] });
      if (!all) return res;
    }
    return res;
  },
  'k-lines'(s, all) {
    const res = [];
    const { n } = s;
    const open = s.units.filter((u) => u.kind === 'reg' && !ctHasCat(s, u));
    for (let k = 2; k < open.length; k++) for (const set of combosOf(open, k)) {
      for (const [kind, key] of [['row', (x) => Math.floor(x / n)], ['col', (x) => x % n]]) {
        const lines = new Set(set.flatMap((u) => ctCands(s, u).map(key)));
        if (lines.size !== k) continue;
        const regs = new Set(set.map((u) => u.i));
        const elim = [];
        for (let x = 0; x < n * n; x++) if (s.cand[x] && lines.has(key(x)) && !regs.has(s.region[x])) elim.push(x);
        if (!elim.length) continue;
        const lineUnits = [...lines].sort((a, b) => a - b).map((i) => (kind === 'row' ? ctRow(s, i) : ctCol(s, i)));
        res.push({ tech: 'k-lines', k, kind, regs: set, lines: lineUnits, focus: [...set, ...lineUnits], cells: set.flatMap((u) => ctCands(s, u)), elim });
        if (!all) return res;
      }
    }
    return res;
  },
  'what-if'(s, all) {
    const res = [];
    for (let x = 0; x < s.n * s.n; x++) {
      if (!s.cand[x]) continue;
      const t = ctClone(s);
      ctPlace(t, x);
      let depth = 0;
      const chain = [];
      while (!ctEmptyUnit(t) && !ctDone(t) && depth < 60) {
        const p = ctNextStep(t, CT_TECH_INDEX['k-lines']);
        if (!p) break;
        ctApply(t, p);
        chain.push(p);
        depth++;
      }
      const u = ctEmptyUnit(t);
      if (!u) continue;
      res.push({ tech: 'what-if', cell: x, unit: u, depth: depth + 1, chain, focus: [], cells: [x], elim: [x] });
      if (!all) return res;
    }
    return res;
  },
};

function ctNextStep(s, maxTech = CT_TECH.length - 1) {
  for (let t = 0; t <= maxTech; t++) {
    const found = CT_FINDERS[CT_TECH[t].id](s, false);
    if (found.length) return found[0];
  }
  return null;
}
function ctFindAll(s, techId) {
  if (!CT_FINDERS[techId]) throw new Error('모르는 고양이 자리 기법: ' + techId);
  return CT_FINDERS[techId](s, true);
}

function ctGrade(n, region, { maxTech = CT_TECH.length - 1, keepSteps = false, cats = [], marks = [] } = {}) {
  const s = ctState(n, region, cats, marks);
  let hardest = -1;
  const counts = new Array(CT_TECH.length).fill(0);
  const steps = [];
  while (!ctDone(s)) {
    if (ctEmptyUnit(s)) return { solved: false, hardest: CT_TECH.length, counts, steps, state: s };
    const step = ctNextStep(s, maxTech);
    if (!step) return { solved: false, hardest: CT_TECH.length, counts, steps, state: s };
    const t = CT_TECH_INDEX[step.tech];
    counts[t]++;
    if (t > hardest) hardest = t;
    if (keepSteps) steps.push(step);
    ctApply(s, step);
  }
  return { solved: true, hardest, counts, steps, state: s, stepCount: counts.reduce((a, b) => a + b, 0) };
}

function ctLevelOf(hardest) {
  if (hardest <= CT_TECH_INDEX['blocks-all']) return 'easy';
  if (hardest <= CT_TECH_INDEX['k-lines']) return 'normal';
  return 'hard';
}

// ── 생성기 ──
function ctRandomPlacement(n, rand) {
  const cols = [];
  const used = new Array(n).fill(false);
  function rec(r) {
    if (r === n) return true;
    for (const c of shuffleWith([...Array(n).keys()], rand)) {
      if (used[c] || (r && Math.abs(c - cols[r - 1]) <= 1)) continue;
      used[c] = true; cols.push(c);
      if (rec(r + 1)) return true;
      used[c] = false; cols.pop();
    }
    return false;
  }
  return rec(0) ? cols : null;
}

// 고양이 자리를 먼저 정하고, 고양이 칸마다 구역 씨앗을 두고 이웃 칸을 붙여 키운다.
// 붙일 때마다 해를 2개까지 세어, 해가 둘이 되는 붙이기는 버린다(칸을 붙이면 자리가 늘기만 하므로).
function ctGrowOnce(n, rand, balance, maxRestarts) {
  for (let restart = 0; restart < maxRestarts; restart++) {
    const cols = ctRandomPlacement(n, rand);
    const region = new Array(n * n).fill(-1);
    cols.forEach((c, r) => (region[r * n + c] = r));
    let left = n * n - n;
    let stuck = false;
    while (left > 0 && !stuck) {
      const frontier = [];
      for (let x = 0; x < n * n; x++) if (region[x] < 0) {
        const r = Math.floor(x / n), c = x % n;
        const regs = [];
        if (r > 0 && region[x - n] >= 0 && !regs.includes(region[x - n])) regs.push(region[x - n]);
        if (r < n - 1 && region[x + n] >= 0 && !regs.includes(region[x + n])) regs.push(region[x + n]);
        if (c > 0 && region[x - 1] >= 0 && !regs.includes(region[x - 1])) regs.push(region[x - 1]);
        if (c < n - 1 && region[x + 1] >= 0 && !regs.includes(region[x + 1])) regs.push(region[x + 1]);
        if (regs.length) frontier.push([x, regs]);
      }
      shuffleWith(frontier, rand);
      let placed = false;
      if (balance) {
        const size = new Array(n).fill(0);
        region.forEach((g) => g >= 0 && size[g]++);
        const pairs = frontier.flatMap(([x, regs]) => regs.map((g) => [x, g, size[g] + rand() * balance]));
        pairs.sort((p, q) => p[2] - q[2]);
        for (const [x, g] of pairs) {
          region[x] = g;
          if (ctCount(n, region, 2) === 1) { placed = true; break; }
          region[x] = -1;
        }
      } else {
        for (const [x, regs] of frontier) {
          for (const g of shuffleWith(regs, rand)) {
            region[x] = g;
            if (ctCount(n, region, 2) === 1) { placed = true; break; }
            region[x] = -1;
          }
          if (placed) break;
        }
      }
      if (placed) left--; else stuck = true;
    }
    if (!stuck) return { region: ctRelabel(n, region), restarts: restart };
  }
  return null;
}

// 구역 번호를 왼쪽 위부터 처음 나오는 순서로 다시 매긴다(같은 판은 같은 글자)
function ctRelabel(n, region) {
  const map = new Map();
  return region.map((g) => { if (!map.has(g)) map.set(g, map.size); return map.get(g); });
}

const ctMinRegion = (n, region) => Math.min(...[...Array(n).keys()].map((g) => region.filter((v) => v === g).length));

// opts: balance(작은 구역부터 키우기 흔들기 값, 0이면 그냥 키우기), maxTech, minTech, minRegion, attempts
function ctGenerate(n, seed, opts = {}) {
  const rand = typeof seed === 'function' ? seed : makeRng(seed);
  const maxTech = opts.maxTech ? ctTechIndex(opts.maxTech) : CT_TECH.length - 1;
  const minTech = opts.minTech ? ctTechIndex(opts.minTech) : -1;
  const balance = opts.balance ?? 3;
  const attempts = opts.attempts ?? 30;
  const minRegion = opts.minRegion || 0;
  let best = null;
  for (let i = 0; i < attempts; i++) {
    const p = ctGrowOnce(n, rand, balance, opts.maxRestarts ?? 300);
    if (!p) continue;
    const grade = ctGrade(n, p.region);
    const sol = ctSolution(n, p.region);
    const r = { n, region: p.region, solution: sol, grade, attempt: i };
    const okRegion = ctMinRegion(n, p.region) >= minRegion;
    if (grade.solved && grade.hardest <= maxTech && grade.hardest >= minTech && okRegion) return { ...r, met: true };
    if (grade.solved && grade.hardest <= maxTech && (!best || grade.hardest > best.grade.hardest)) best = r;
  }
  return best ? { ...best, met: false } : null;
}

function ctCanonical(region) {
  const n = ctSizeOf(region);
  const at = (r, c) => r * n + c;
  const tf = [
    (r, c) => at(r, c), (r, c) => at(r, n - 1 - c), (r, c) => at(n - 1 - r, c), (r, c) => at(n - 1 - r, n - 1 - c),
    (r, c) => at(c, r), (r, c) => at(c, n - 1 - r), (r, c) => at(n - 1 - c, r), (r, c) => at(n - 1 - c, n - 1 - r),
  ];
  const forms = tf.map((f) => {
    const g = new Array(n * n);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) g[at(r, c)] = region[f(r, c)];
    return ctFormat(ctRelabel(n, g));
  });
  return forms.sort()[0];
}

// ── 이름과 문장 ──
const ctCellName = (n, x) => `${Math.floor(x / n) + 1}줄 ${(x % n) + 1}칸`;
const ctDefaultRegionName = (g) => `${g + 1}번 구역`;
function ctUnitName(u, regionName = ctDefaultRegionName) {
  return u.kind === 'row' ? `${u.i + 1}번째 가로줄` : u.kind === 'col' ? `${u.i + 1}번째 세로줄` : regionName(u.i);
}

function ctStepText(n, step, regionName = ctDefaultRegionName) {
  const C = (x) => ctCellName(n, x);
  const U = (u) => ctUnitName(u, regionName);
  const name = CT_TECH[CT_TECH_INDEX[step.tech]].name;
  switch (step.tech) {
    case 'last-spot': {
      const u = U(step.unit), c = C(step.place[0]);
      return { name, where: `${josa(u, '을를')} 보세요.`, why: `${u}에 고양이를 둘 수 있는 곳이 ${c} 하나만 남았어요.`, todo: `${c}에 고양이를 놓아요.` };
    }
    case 'one-line': {
      const r = U(step.reg), l = U(step.line);
      if (step.variant === 'reg-in-line') {
        return { name, where: `${josa(r, '을를')} 보세요.`, why: `${r}의 남은 자리가 모두 ${l}에 있어요. 그래서 ${l}의 다른 칸은 비워 둬요.`, todo: `${step.elim.map(C).join(', ')}에 ×를 해요.` };
      }
      return { name, where: `${josa(l, '을를')} 보세요.`, why: `${l}에 남은 자리가 모두 ${r} 안에 있어요. 그래서 ${r}의 다른 칸은 비워 둬요.`, todo: `${step.elim.map(C).join(', ')}에 ×를 해요.` };
    }
    case 'blocks-all': {
      const c = C(step.cell), u = U(step.unit);
      return { name, where: `${josa(u, '과와')} ${josa(c, '을를')} 함께 보세요.`, why: `${c}에 고양이를 두면 ${u}의 남은 자리가 모두 막혀요. 그러면 ${u}에 둘 곳이 없으니 ${josa(c, '은는')} 비워 둬요.`, todo: `${c}에 ×를 해요.` };
    }
    case 'k-lines': {
      const regs = step.regs.map((u) => U(u)).join(', ');
      const lineWord = step.kind === 'row' ? '가로줄' : '세로줄';
      const lines = step.lines.map((u) => u.i + 1).join('·') + '번째 ' + lineWord;
      return { name, where: `${josa(regs, '을를')} 함께 보세요.`, why: `구역 ${step.k}개(${regs})의 남은 자리가 모두 ${lines} 안에 있어요. 이 ${lineWord} ${step.k}개는 이 구역들 몫이니, 다른 구역의 칸은 비워 둬요.`, todo: `${step.elim.map(C).join(', ')}에 ×를 해요.` };
    }
    case 'what-if': {
      const c = C(step.cell), u = U(step.unit);
      return { name, where: `${josa(c, '을를')} 보세요.`, why: `${c}에 고양이를 두었다고 해 보면, ${step.depth}걸음 뒤에 ${u}에 둘 곳이 없어져요. 그래서 ${josa(c, '은는')} 비워 둬요.`, todo: `${c}에 ×를 해요.` };
    }
    default:
      throw new Error('문장 틀이 없는 기법: ' + step.tech);
  }
}

// ---- src/find-step.mjs ----
// 풀이 길을 따라가며 어떤 기법을 쓸 수 있는 상태를 찾는다(차시 '걸음' 문제, 묶음 만들기, 시험이 함께 쓴다).

const stepMatches = (step, match) => {
  if (!match) return true;
  for (const [k, v] of Object.entries(match)) {
    const got = k === 'unitKind' ? step.unit && step.unit.kind : step[k];
    if (Array.isArray(v) ? !v.includes(got) : got !== v) return false;
  }
  return true;
};

// 풀이 길을 따라가며 tech 를 쓸 수 있는 상태를 찾는다. nth 번째(0부터) 상태를 돌려준다.
// easiest: 그 상태에서 풀이기가 고르는 가장 쉬운 단계가 바로 이 기법일 때만(더 쉬운 기법으로는 진행이 없을 때)
function sdFindLessonStep(puzzle, tech, { nth = 0, match = null, easiest = false } = {}) {
  const st = sdState(puzzle);
  let seen = 0;
  for (let guard = 0; guard < 400; guard++) {
    const first = easiest ? sdNextStep(st) : null;
    const found = easiest && (!first || first.tech !== tech) ? [] : sdFindAll(st, tech).filter((s) => stepMatches(s, match));
    if (found.length) {
      if (seen === nth) return { values: st.val.slice(), cand: st.cand.slice(), step: found[0], all: found };
      seen++;
    }
    const next = sdNextStep(st);
    if (!next) return null;
    sdApply(st, next);
    if (st.val.every(Boolean)) return null;
  }
  return null;
}
function ctFindLessonStep(n, region, tech, { nth = 0, match = null, easiest = false } = {}) {
  const st = ctState(n, region);
  let seen = 0;
  for (let guard = 0; guard < 400; guard++) {
    const first = easiest ? ctNextStep(st) : null;
    const found = easiest && (!first || first.tech !== tech) ? [] : ctFindAll(st, tech).filter((s) => stepMatches(s, match));
    if (found.length) {
      if (seen === nth) return { cats: st.cat.map((v, x) => (v ? x : -1)).filter((x) => x >= 0), cand: st.cand.slice(), step: found[0], all: found };
      seen++;
    }
    const next = ctNextStep(st);
    if (!next) return null;
    ctApply(st, next);
    if (st.cat.filter(Boolean).length === n) return null;
  }
  return null;
}


// ---- src/hint.mjs ----
// 힌트 3단계: 1 어디를 볼까 → 2 기법 이름과 이유 → 3 이렇게 해요(칸 표시).
// 풀이기가 지금 판에서 실제로 찾은 논리 단계로 문장을 만든다. 정답(solution)은 "틀린 수 짚기"에만 쓴다.

// 스도쿠 힌트. values: 지금 판(주어진 수 + 사용자가 놓은 수), notes: 칸마다 메모 비트(없으면 null)
function sdHint({ puzzle, values, notes = null, solution }) {
  const n = Math.round(Math.sqrt(values.length));
  const C = (x) => sdCellName(n, x);
  if (values.every(Boolean) && values.every((v, x) => v === solution[x])) return { kind: 'done', where: '다 풀었어요.', why: '', todo: '', focus: [], cells: [] };
  // 1) 사용자가 놓은 수가 답과 다르면 그 수를 먼저 짚는다
  const conflicts = sdConflicts(values);
  const wrong = values.map((v, x) => (v && !puzzle[x] && v !== solution[x] ? x : -1)).filter((x) => x >= 0);
  if (wrong.length) {
    const x = wrong.find((y) => conflicts.includes(y)) ?? wrong[0];
    const clash = conflicts.includes(x);
    return {
      kind: 'mistake', name: '다시 보기', focus: [], cells: [x], mark: [x],
      where: `${josa(C(x), '을를')} 다시 보세요.`,
      why: clash ? `${C(x)}의 ${josa(String(values[x]), '이가')} 같은 줄이나 상자의 숫자와 겹쳐요.` : `${C(x)}의 ${josa(String(values[x]), '은는')} 규칙은 지키지만, 끝까지 풀면 맞지 않는 수예요.`,
      todo: `${C(x)}의 숫자를 지우고 다시 생각해 봐요.`,
    };
  }
  // 2) 메모 점검: 들어가야 할 숫자가 빠졌거나, 이미 같은 줄·상자에 있는 숫자가 남아 있으면 먼저 알린다
  let useNotes = null;
  if (notes && notes.some((m, x) => m && !values[x])) {
    const base = sdState(values);
    for (let x = 0; x < n * n; x++) {
      if (values[x] || !notes[x]) continue;
      const need = 1 << (solution[x] - 1);
      if (!(notes[x] & need)) return { kind: 'note', name: '메모 다시 보기', focus: [], cells: [x], mark: [x], where: `${C(x)}의 메모를 보세요.`, why: '이 칸의 메모에 들어갈 수 있는 숫자가 빠져 있어요.', todo: '메모를 다시 적어 봐요. 같은 줄, 세로줄, 상자에 없는 숫자를 모두 적어요.' };
      const extra = notes[x] & ~base.cand[x];
      if (extra) {
        const ds = [];
        for (let d = 1; d <= n; d++) if (extra & (1 << (d - 1))) ds.push(d);
        return { kind: 'note', name: '메모 다시 보기', focus: [], cells: [x], mark: [x], where: `${C(x)}의 메모를 보세요.`, why: `메모 중에 지워야 할 것이 남아 있어요. ${josa(ds.join(', '), '은는')} 같은 줄이나 상자에 이미 있어요.`, todo: `${C(x)}의 메모에서 ${josa(ds.join(', '), '을를')} 지워요.`, elimNotes: [{ x, mask: extra }] };
      }
    }
    useNotes = notes;
  }
  // 3) 풀이기로 다음 한 단계를 찾는다. 메모를 근거로 찾았으면 문장도 "메모를 보면"으로 말한다.
  //    후보 지우기 단계는 그 한 단계만 보여 주고, 「그대로 하기」가 메모를 채워 그 후보를 지운다(다음 힌트는 그 메모에서 이어진다).
  const st = sdState(values, useNotes);
  const step = sdNextStep(st);
  if (!step) return { kind: 'stuck', name: '', focus: [], cells: [], where: '지금 배운 기법으로는 다음 수를 찾기 어려워요.', why: '메모를 다시 적어 보거나, 처음부터 다시 풀어 보세요.', todo: '' };
  const memo = Boolean(useNotes) && !onlyPeers(values, useNotes, step);
  const t = sdStepText(n, step, { memo });
  return {
    kind: 'step', name: t.name, tech: step.tech, steps: [step], focus: step.focus, cells: step.cells,
    where: t.where, why: t.why, todo: t.todo, memo,
    place: step.place ? step.place[0] : null, elim: step.elim || [],
    techs: [step.tech], hardest: SD_TECH_INDEX[step.tech],
  };
}

// 단계의 모든 주장(놓을 칸·지울 후보·칸·줄 종류와 번호·숫자)이 같으면 같은 단계
function sdStepKey(a) {
  const u = (x) => (x ? x.kind + x.i : '');
  return JSON.stringify({ p: a.place, e: a.elim, c: a.cells, u: u(a.unit), b: u(a.box), l: u(a.line), ls: (a.lines || []).map(u), cr: (a.cross || []).map(u), d: a.digit, ds: a.digits, cell: a.cell });
}
// 이 단계가 메모 없이 주변 숫자만으로도 찾아지는가(그러면 "메모를 보면"을 붙이지 않는다)
function onlyPeers(values, notes, step) {
  const base = sdState(values);
  const same = (a) => sdStepKey(a) === sdStepKey(step);
  return sdFindAll(base, step.tech).some(same);
}

// 고양이 자리 힌트. cats: 놓인 고양이 칸, marks: 사용자가 × 한 칸
function ctHint({ n, region, cats, marks = [], solution, regionName = ctDefaultRegionName }) {
  const C = (x) => ctCellName(n, x);
  const sol = new Set(solution);
  if (cats.length === n && cats.every((x) => sol.has(x))) return { kind: 'done', where: '다 풀었어요.', why: '', todo: '', focus: [], cells: [] };
  const conf = ctConflicts(n, region, cats);
  const wrongCats = cats.filter((x) => !sol.has(x));
  if (wrongCats.length) {
    const x = wrongCats.find((y) => conf.cells.includes(y)) ?? wrongCats[0];
    const r = conf.reasons.find((q) => q.a === x || q.b === x);
    const whyMap = { row: '같은 가로줄에 고양이가 또 있어요.', col: '같은 세로줄에 고양이가 또 있어요.', region: '같은 구역에 고양이가 또 있어요.', touch: '다른 고양이와 닿아 있어요. 대각선도 닿은 거예요.' };
    return {
      kind: 'mistake', name: '다시 보기', focus: [], cells: [x], mark: [x],
      where: `${C(x)}의 고양이를 다시 보세요.`,
      why: r ? whyMap[r.why] : '규칙은 지키지만, 끝까지 풀면 이 자리는 답이 아니에요.',
      todo: `${C(x)}의 고양이를 치우고 다시 생각해 봐요.`, remove: x,
    };
  }
  const wrongMarks = marks.filter((x) => sol.has(x));
  if (wrongMarks.length) {
    const x = wrongMarks[0];
    return { kind: 'note', name: '× 다시 보기', focus: [], cells: [x], mark: [x], where: `${C(x)}의 ×를 다시 보세요.`, why: '이 칸을 비워 둘 까닭이 아직 없어요. 고양이가 들어갈 수도 있는 칸이에요.', todo: `${C(x)}의 ×를 지워요.`, unmark: x };
  }
  const st = ctState(n, region, cats, marks);
  if (ctEmptyUnit(st)) return { kind: 'stuck', name: '', focus: [], cells: [], where: '고양이를 둘 곳이 없는 줄이나 구역이 생겼어요.', why: '×를 다시 확인해 보세요.', todo: '' };
  const step = ctNextStep(st);
  if (!step) return { kind: 'stuck', name: '', focus: [], cells: [], where: '지금 기법으로는 다음 수를 찾기 어려워요.', why: '', todo: '' };
  const t = ctStepText(n, step, regionName);
  return {
    kind: 'step', name: t.name, tech: step.tech, steps: [step], focus: step.focus, cells: step.cells || [],
    where: t.where, why: t.why, todo: t.todo,
    place: step.place ? step.place[0] : null, elim: step.elim || [],
  };
}

// 메모 자동 채우기: 같은 줄·세로줄·상자에 없는 숫자 모두
function sdAutoNotes(values) {
  const st = sdState(values);
  return st.cand.map((m, x) => (values[x] ? 0 : m));
}
const sdNoteCount = (m) => sdPopcount(m);

// ---- src/daily.mjs ----
// 오늘의 퍼즐과 자유 연습: 기기에서 씨앗으로 만든다. 같은 날짜·난이도면 어느 기기에서나 같은 판.
// GEN_VERSION: 생성기 판 번호. 생성기를 고쳐 같은 씨앗의 판이 달라지면 올리고, 기록(daily[날짜].gen)에 남긴다.

const GEN_VERSION = 1;

const SD_LEVELS = {
  easy: { label: '쉬움', max: sdTechIndex('naked-single'), maxTech: 'naked-single', minTech9: null },
  normal: { label: '보통', max: sdTechIndex('claiming'), maxTech: 'claiming', minTech9: 'pointing' },
  hard: { label: '어려움', max: sdTechIndex('x-wing'), maxTech: 'x-wing', minTech9: 'naked-pair' },
};
const CT_LEVELS = {
  easy: { label: '쉬움', max: ctTechIndex('blocks-all'), maxTech: 'blocks-all', minTech: null },
  normal: { label: '보통', max: ctTechIndex('k-lines'), maxTech: 'k-lines', minTech: 'k-lines' },
  hard: { label: '어려움', max: ctTechIndex('what-if'), maxTech: 'what-if', minTech: 'what-if' },
};
// 오늘의 퍼즐 크기: 쉬움은 아이도 끝낼 수 있게 작게
const DAILY_SIZES = { easy: { sd: 6, ct: 6 }, normal: { sd: 9, ct: 7 }, hard: { sd: 9, ct: 8 } };
const CT_DEVICE_MAX = 8; // 기기에서 만드는 고양이 자리는 8×8까지(9×9 이상은 묶음)

function practiceSudoku(n, level, seed) {
  const L = SD_LEVELS[level] || SD_LEVELS.easy;
  const minTech = n === 9 ? L.minTech9 : null;
  return sdGenerate(n, seed, { maxTech: L.maxTech, minTech, attempts: minTech ? 60 : 1 });
}

function practiceCats(n, level, seed) {
  if (n > CT_DEVICE_MAX) throw new Error('9×9 이상 고양이 자리는 묶음에서 고른다');
  const L = CT_LEVELS[level] || CT_LEVELS.easy;
  // 4×4는 작은 구역부터 키우면 모두 같은 기법이 되어, 쉬움은 그냥 키우기를 섞는다
  const balance = n <= 5 && level === 'easy' ? 0 : 3;
  const min = n <= 5 ? null : L.minTech;
  return ctGenerate(n, seed, { maxTech: L.maxTech, minTech: min, balance, attempts: 80, minRegion: n >= 6 ? 2 : 0 })
    || ctGenerate(n, seed + 1, { balance: 0, attempts: 30 });
}

function dailyPuzzles(date, level = 'easy') {
  const lv = SD_LEVELS[level] ? level : 'easy';
  const k = Object.keys(SD_LEVELS).indexOf(lv);
  const size = DAILY_SIZES[lv];
  const sudoku = practiceSudoku(size.sd, lv, seedFromText(date, 100 + k));
  const cats = practiceCats(size.ct, lv, seedFromText(date, 200 + k));
  return { date, level: lv, gen: GEN_VERSION, sudoku: { n: size.sd, ...sudoku }, cats };
}

// 기기 시간대 기준 오늘 날짜 "YYYY-MM-DD"
function todayKey(now = new Date()) {
  const y = now.getFullYear(), m = String(now.getMonth() + 1).padStart(2, '0'), d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
